<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typerkowo – typuj mecze dla zabawy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--card:#fff;--ink:#12201A;--mute:#5B6B62;--line:#CBD6CF;--green:#1E6B45;--gi:#fff;--gold:#F2C230;--goldi:#3a2c00;--bad:#A8362B;--silver:#C3CBC6;--bronze:#C98B5A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1713;--card:#17231D;--ink:#E8F0EB;--mute:#93A59B;--line:#2B3B33;--green:#4FB07F;--gi:#06130c;--bad:#E57C70;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:1120px;margin:0 auto;padding:6px 16px 56px}
body{padding-bottom:76px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.layout.one{max-width:760px}
.aside{display:none}
@media (min-width:1320px){.layout:not(.one){grid-template-columns:minmax(0,1fr) 320px}.aside{display:block;position:sticky;top:24px;align-self:start}}
.aside .prizebar{margin:16px 0 14px;flex-direction:column;align-items:flex-start}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.acard h3{font-size:18px;margin-bottom:8px}
ol.mini{list-style:none;margin:0 0 10px;padding:0}
ol.mini li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
ol.mini li.you{background:color-mix(in srgb,var(--gold) 28%,transparent)}
.mp{font:800 16px "Bricolage Grotesque",sans-serif;width:22px}.mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);margin:4px 0 0}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{font:600 15px "Source Sans 3",system-ui,sans-serif;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--green);color:var(--gi)}
button.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}button.del{background:var(--bad);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* górny pasek: nazwa + zakładki */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px 8px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-.02em}
.brandbtn{background:none;color:var(--ink);padding:0;font:inherit;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--ink) 0 26%,transparent 27%),var(--gold);box-shadow:inset 0 0 0 3px var(--green);flex:none}
.me{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nick{font-weight:700}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;min-width:0;background:none;color:var(--mute);border-radius:0;padding:9px 1px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav button[aria-current="page"]{color:var(--green)}
@media (min-width:960px){
  body{padding-bottom:0}
  .top,.bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:244px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px 18px;z-index:15;overflow-y:auto}
  .side .brand{font-size:27px}.side .logo{width:30px;height:30px}.side .brandbtn{padding:0 8px}
  .side nav{display:flex;flex-direction:column;gap:4px;margin-top:28px}
  .side nav button{display:flex;align-items:center;gap:14px;background:none;color:var(--mute);border-radius:10px;padding:12px 14px;font-size:17px;font-weight:600;text-align:left;white-space:nowrap}
  .side nav button:hover{background:var(--bg);color:var(--ink)}
  .side nav button[aria-current="page"]{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--ink);box-shadow:inset 4px 0 0 var(--gold)}
  .side nav button[aria-current="page"] .ic{color:var(--green)}
  .sideme{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .sideme .nick{display:block;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sideme button{width:100%}
  .wrap{max-width:none;margin:0;padding:6px 40px 56px 284px}
  .layout{max-width:1180px;margin:0 auto}
  .layout.one{max-width:760px}
}

/* baner nagrody */
.prizebar{display:flex;gap:14px;align-items:center;background:var(--green);color:var(--gi);border-radius:14px;padding:14px 16px;margin:16px 0 12px}
.pbadge{background:var(--gold);color:var(--goldi);border-radius:12px;padding:8px 12px;font:800 20px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.prizebar span{font-size:15px}

/* ligi i mecze */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.chip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;white-space:nowrap;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--green);color:var(--gi);border-color:var(--green)}
.sec{margin:26px 0 4px;font-size:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.lg{margin:22px 0 4px;font-size:22px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.day{margin:14px 0 6px;color:var(--mute);font-weight:600;font-size:14px}
.match{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px 14px;margin-bottom:10px}
.match.p4{border-left-color:var(--gold)}.match.p3{border-left-color:var(--green)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:10px;gap:8px;min-height:26px}
.meta .time{font:800 18px "Bricolage Grotesque",sans-serif;color:var(--ink);margin-right:8px}
.soon{background:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:13px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}.team.r{text-align:right}
.score{display:flex;align-items:center;gap:6px}
.score input{width:52px;height:52px;text-align:center;font:800 24px "Bricolage Grotesque",sans-serif;padding:0;border-radius:12px;border-width:2px}
.fin{font:800 26px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;min-width:84px;text-align:center;padding:6px 12px;border-radius:12px;background:var(--ink);color:var(--bg)}
.fin.none{background:var(--line);color:var(--mute)}
.res{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;min-height:34px}
.pill{border-radius:99px;padding:2px 10px;font-weight:600;font-size:14px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.p4{background:var(--gold);color:var(--goldi)}.pill.p3{background:var(--green);color:var(--gi)}
.ok{color:var(--green);font-size:14px}.err{color:var(--bad);font-size:14px}
@media (max-width:420px){.team{font-size:15px}.score input{width:46px;height:46px;font-size:22px}.row{gap:8px}.fin{min-width:72px;font-size:22px}}

/* ranking */
.podium{display:flex;gap:10px;align-items:flex-end;margin:6px 0 20px}
.pod{flex:1;min-width:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pod .info{padding:14px 6px 12px}
.pod.you{box-shadow:0 0 0 2px var(--gold)}
.pod .md{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 20px "Bricolage Grotesque",sans-serif;color:#12201A}
.pod .pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{font:800 24px "Bricolage Grotesque",sans-serif;line-height:1.1;margin-top:2px}
.pod .ps{color:var(--mute);font-size:13px}
.pod.r1 .md,.pod.r1 .step{background:var(--gold)}.pod.r2 .md,.pod.r2 .step{background:var(--silver)}.pod.r3 .md,.pod.r3 .step{background:var(--bronze)}
.podium.plain .md,.podium.plain .step{background:var(--line)}
.note.nprize{border-left-color:var(--green);color:var(--ink);margin-bottom:12px}.note{margin:0 0 12px}
.pod.r1 .step{height:44px}.pod.r2 .step{height:28px}.pod.r3 .step{height:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:14px}
.n{text-align:right}.pos{font:800 18px "Bricolage Grotesque",sans-serif;width:44px}
tr.you td{background:color-mix(in srgb,var(--gold) 28%,transparent);font-weight:600}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;margin-top:16px}
.box label{display:block;margin:10px 0 4px;font-weight:600}.box input:not([type=checkbox]){width:100%}.box .chk{display:flex;gap:8px;font-weight:400;align-items:flex-start}
.box button{margin-top:6px}
.prize{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 28px "Bricolage Grotesque",sans-serif;background:var(--gold);color:var(--goldi)}
.prize p{margin:2px 0 0;color:var(--mute)}.note{background:var(--card);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;color:var(--mute);font-size:15px}
.adm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.adm .score input{width:42px;height:40px;font-size:18px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}


/* komentarze do meczów */
.cbar{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cbtn{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}
.cbtn:hover{color:var(--text,inherit);text-decoration:underline}
.cpanel{margin-top:8px}
.cform{display:flex;gap:8px;margin:6px 0 10px}.cform input{flex:1;min-width:0}
.cform.rf{margin:6px 0 6px 0}
.cmt{padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--line) 35%,transparent);margin-bottom:6px}
.cmt.mine{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.cmt.rep{outline:2px solid var(--bad)}
.cmt .mb{white-space:pre-wrap}
.cmt .at{font-weight:700}
.crepl{margin:0 0 8px 18px;padding-left:10px;border-left:3px solid var(--line)}
.cmore{font-size:13px;color:var(--mute);margin:4px 0}
.crl{margin-top:14px}.crl .cmt{margin-bottom:8px}


/* znajomi i wiadomości prywatne */
.nbadge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-style:normal;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.bnav button{position:relative}.bnav .nbadge{position:absolute;top:3px;left:calc(50% + 6px)}
.side nav .nbadge{margin-left:auto}
.frwrap{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:12px;align-items:start}
.frcol,.dmcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.frcol h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.frcol h3:first-child{margin-top:0}
.fitem{display:flex;align-items:center;gap:8px;width:100%;background:none;color:inherit;text-align:left;padding:9px 10px;border-radius:10px;font-weight:600}
.fitem:hover,.fitem[aria-current="true"]{background:color-mix(in srgb,var(--green) 12%,transparent)}
.fitem .nbadge{margin-left:auto}
.frreq{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 4px;flex-wrap:wrap}
.frreq .ab{display:flex;gap:6px}.frreq button{padding:6px 10px;font-size:13px}
.dmhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.dml{height:min(50vh,440px);overflow-y:auto;padding:4px}
.dmm{max-width:82%;padding:7px 11px;border-radius:14px;margin-bottom:6px;background:color-mix(in srgb,var(--line) 45%,transparent);overflow-wrap:anywhere;width:fit-content;white-space:pre-wrap}
.dmm.mine{margin-left:auto;background:color-mix(in srgb,var(--gold) 28%,transparent)}
.dmm time,.dmm .rd{display:block;font-size:11px;color:var(--mute);white-space:normal}
.dmm .lnk{font-size:11px}
.dmback{display:none}
.pact{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:720px){.frwrap{grid-template-columns:1fr}.frwrap.open .frcol{display:none}.frwrap:not(.open) .dmcol{display:none}.dmback{display:inline-block}.pact{margin-left:0;width:100%}}


/* dzwoneczek */
.bellwrap{position:relative;display:inline-block}
.bellbtn{position:relative;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:50%;width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.bellbtn .nbadge{position:absolute;top:-5px;right:-5px}
.bellbtn.on{border-color:var(--gold)}
.bellp{position:fixed;top:60px;left:8px;right:8px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:70vh;overflow-y:auto;text-align:left}
.bellh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--card)}
.nitem{display:block;width:100%;background:none;color:inherit;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);border-radius:0;font-weight:400;font-size:15px}
.nitem:hover{background:color-mix(in srgb,var(--green) 8%,transparent)}
.nitem.un{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.nitem b{font-weight:700}.nitem small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.nempty{padding:18px 14px;color:var(--mute)}
.dtop{display:none}
@media(max-width:520px){.top .brand{font-size:24px}.top .me .nick{display:none}.top .me{flex-wrap:nowrap}.brandrow{flex-wrap:nowrap}.bellbtn{width:38px;height:38px}.top .me button.ghost{padding:8px 12px}}
@media(min-width:960px){
  .dtop{display:flex;justify-content:flex-end;align-items:center;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -40px 8px -40px;padding:8px 40px}
  .bellp{position:absolute;top:calc(100% + 8px);left:auto;right:0;width:360px}
}


/* odznaki */
.bdgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:10px 0}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.bcard .bi{font-size:30px;line-height:1;filter:grayscale(1);opacity:.35}
.bcard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.bcard.on .bi{filter:none;opacity:1}
.bcard .bn{font-weight:800;font-size:17px}.bcard .bl{font-size:13px;color:var(--mute)}
.bcard .pips{display:flex;gap:4px;margin:4px 0}.bcard .pips i{flex:1;height:6px;border-radius:99px;background:var(--line)}.bcard.on .pips i.f{background:var(--gold)}
.bcard .bnext{font-size:13px}


.xpcard{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.lvbig{flex:none;width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--goldi);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:800;line-height:1;box-shadow:inset 0 0 0 4px var(--green)}
.lvbig small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.xpbody{flex:1;min-width:0}.xprow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}.xprow b{font-size:20px}
.xpsrc{margin-top:6px;font-size:13px}
.achg{font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 0}
.lvchip{font-size:13px;font-weight:700;background:var(--gold);color:var(--goldi);border-radius:99px;padding:2px 10px;vertical-align:middle}
.lvchip.sm{font-size:11px;padding:0 7px;margin-left:2px}
.dif{border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.dif.e{background:#d6efdf;color:#17623a}.dif.m{background:#fbeab0;color:#6d5000}.dif.h{background:#ffd8c0;color:#9a3b00}.dif.l{background:#e4d4ff;color:#58279c}
.bcard .okb{font-weight:700;color:var(--green)}
.bcard .meter{margin-top:4px}


/* prognoza społeczności */
.match.feat{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 7%,var(--card))}
.featb{background:var(--gold);color:var(--goldi);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;margin-right:6px;white-space:nowrap}
.featn{margin:10px 0 0;text-align:center;font-size:13px;color:var(--mute)}
.fc{margin-top:10px}
.fc .fh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600}
.fbar{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--line)}
.fbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
.fbar .fh1{background:var(--green);color:var(--gi)}.fbar .fd{background:#B7C3BB;color:var(--ink)}.fbar .fa1{background:var(--gold);color:var(--goldi)}
.fleg{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-top:3px}
.fleg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fleg .c{text-align:center;flex:none}.fleg .r{text-align:right}

/* czat */
.chat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
.cl{height:min(60vh,520px);overflow-y:auto;padding:4px 4px 8px}
.msg{padding:8px 10px;border-radius:10px;margin-bottom:6px}
.msg.mine{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.msg.rep{outline:2px solid var(--bad)}
.mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mh b{font-weight:700}.mh time{color:var(--mute);font-size:13px}
.mb{overflow-wrap:anywhere;margin:2px 0}
.ma{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.ma select{padding:2px 6px;font-size:13px}
.lnk{background:none;color:var(--mute);padding:0;font-size:13px;text-decoration:underline;border-radius:4px}
.lnk.bad{color:var(--bad)}
.bdg{border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}

<h3>5. Twoje prawa</h3><p>Masz prawo do: dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, przenoszenia danych oraz sprzeciwu wobec przetwarzania opartego na prawnie uzasadnionym interesie. Nick, adres e-mail i hasło możesz zmienić, a konto usunąć samodzielnie w zakładce „Konto”. W pozostałych sprawach napisz na <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>. Masz też prawo wnieść skargę do Prezesa Urzędu Ochrony Danych Osobowych (<a href="https://uodo.gov.pl" target="_blank" rel="noopener">uodo.gov.pl</a>).</p>
<h3>6. Pliki cookies i pamięć przeglądarki</h3><p>Serwis korzysta z pamięci przeglądarki (np. localStorage lub ciasteczek) wyłącznie w celach niezbędnych do działania: utrzymania sesji po zalogowaniu. Nie używamy cookies reklamowych ani analitycznych. Formularze logowania i rejestracji korzystają z zabezpieczenia Cloudflare Turnstile, które służy wyłącznie do sprawdzenia, że formularz wypełnia człowiek, i może w tym celu zapisywać dane techniczne w przeglądarce. Serwis korzysta z czcionek Google Fonts, przy czym zapytania o czcionki trafiają do serwerów Google.</p>

  S.leagues=(lg.data||[]).slice().sort((a,b)=>{const i=LEAGUE_ORDER.indexOf(a.code),j=LEAGUE_ORDER.indexOf(b.code);return (i<0?99:i)-(j<0?99:j)||a.id-b.id});S.matches=mt.data||[];S.side=sd.data||[];S.err=(lg.error||mt.error)?"Nie udało się wczytać danych. Odśwież stronę.":"";
  S.tips={};S.me=null;

  if(S.tab=="ranking")await loadBoard();

function calcXp(st,tips){
  const tipXp=tips*XP_TIP;let achXp=0,got=0,all=0;

  const xp=tipXp+achXp;let L=1;while(xp>=xpFor(L+1))L++;

function profView(){

  const own=S.prof.own,st=profStats(),me=S.prof.user||{},since=me.created_at?new Date(me.created_at).toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"}):"",role=me.is_admin?`<span class="bdg o">Organizator</span>`:me.is_moderator?`<span class="bdg a">Administrator</span>`:"";

  const backBtn=own?"":`<button class="ghost back" data-act="pview" data-nick="">Wróć do swojego profilu</button>`;
  const rank=`<h2 class="sec">Miejsce w rankingu</h2><div class="tiles"><div class="tile"><div>${rankOf(S.side,me.nick)}</div><div class="tl">Ten miesiąc, ranking nagrodowy (wszystkie ligi)</div></div><div class="tile"><div>${rankOf(S.prof.all,me.nick)}</div><div class="tl">Cały sezon</div></div></div>`;
  if(!st.n)return sch+backBtn+head+rank+badgesHTML(st)+`<h2 class="sec">Statystyki</h2><p class="note">${own?"Nie masz jeszcze rozliczonych typów. Statystyki pojawią się po pierwszych zakończonych meczach.":"Ten gracz nie ma jeszcze rozliczonych typów."}${own&&st.pending?` Czeka na wynik: ${st.pending}.`:""}</p>`;
  const sk=pc(st.hit,st.n),dk=pc(st.exact,st.n);
  const tiles=`<div class="tiles">${tile(st.total,"Zdobyte punkty")}${tile(sk+"<small>%</small>","Skuteczność (trafiony zwycięzca lub remis)",sk)}${tile(dk+"<small>%</small>","Dokładne wyniki",dk)}${tile((st.total/st.n).toFixed(2).replace(".",","),"Średnio punktów na typ")}${tile(st.n,"Rozliczone typy"+(own&&st.pending?` (czeka na wynik: ${st.pending})`:""))}${tile(st.best,"Najlepsza seria trafień"+(st.cur?` (teraz: ${st.cur})`:""))}</div>`;
  const lgRows=Object.entries(st.lg).sort((a,b)=>b[1].p-a[1].p).map(([k,o])=>`<tr><td>${flagName(k)}${esc(k)}</td><td class="n">${o.n}</td><td class="n">${o.p}</td><td class="n">${pc(o.h,o.n)}%</td><td class="n">${o.e}</td></tr>`).join("");
  const lgT=`<h2 class="sec">Według lig</h2><div style="overflow-x:auto"><table><thead><tr><th>Liga</th><th class="n">Typy</th><th class="n">Pkt</th><th class="n">Skut.</th><th class="n">Dokł.</th></tr></thead><tbody>${lgRows}</tbody></table></div>`;
  const last=st.calc.slice(-8).reverse().map(x=>{const m=x.matches;return`<div class="lt"><div><b>${esc(m.home)} – ${esc(m.away)}</b><p class="sub">${flagName(m.leagues?.name)}${esc(m.leagues?.name||"")}<span class="mo"> · typ ${x.home_goals}:${x.away_goals} · wynik ${m.home_goals}:${m.away_goals}</span></p></div><span class="hide">typ ${x.home_goals}:${x.away_goals}</span><span class="hide">wynik ${m.home_goals}:${m.away_goals}</span><span class="pill p${x.b}">+${x.p} pkt${x.matches.featured?" ⭐":""}</span></div>`}).join("");
  return sch+backBtn+head+rank+badgesHTML(st)+`<h2 class="sec">Statystyki</h2>`+tiles+`<p class="sub">Statystyki liczą się z rozegranych meczów, w których wpisano wynik.</p>`+lgT+`<h2 class="sec">${own?"Ostatnie typy":"Ostatnie typy gracza"}</h2>`+last}

async function loadBoard(){
  const n=new Date();let from=null,to=null;
  if(S.scope=="week"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));from=d;to=new Date(d.getTime()+7*864e5)}
  if(S.scope=="month"){from=new Date(n.getFullYear(),n.getMonth(),1);to=new Date(n.getFullYear(),n.getMonth()+1,1)}
  const {data,error}=await sb.rpc("get_leaderboard",{p_league:S.bleague||null,p_from:from&&from.toISOString(),p_to:to&&to.toISOString()});
  S.board=data||[];if(error)S.err="Nie udało się wczytać rankingu."}

// mecze zawsze osobno dla każdej ligi i posortowane godzinami (niezależnie od kolejności wpisywania)
function groups(list,desc){return S.leagues.map(l=>({l,items:list.filter(m=>m.league_id==l.id).sort((a,b)=>(new Date(a.kickoff)-new Date(b.kickoff))*(desc?-1:1))})).filter(g=>g.items.length)}
function section(list,desc,fn){return groups(list,desc).map(g=>{let last="";return`<h3 class="lg">${flag(g.l.code)}${esc(g.l.name)}</h3>`+g.items.map(m=>{const d=dayOf(m.kickoff),h=d!=last?`<div class="day">${esc(d)}</div>`:"";last=d;return h+fn(m)}).join("")}).join("")}

function card(m){
  const open=new Date(m.kickoff)>Date.now(),t=S.tips[m.id],fin=m.home_goals!=null,p=fin?(pts(t,m)??0):0,b=fin?(base(t,m)??0):0,tt=t?`Twój typ: ${t.home_goals} : ${t.away_goals}`:"Nie typowałeś";
  let mid,bot;
  if(fin){mid=`<div class="fin">${m.home_goals} : ${m.away_goals}</div>`;bot=`<span>${tt}</span><span class="pill p${b}">+${p} pkt${m.featured?" ⭐":""}</span>`}
  else if(open&&S.user){mid=`<div class="score"><input type="number" min="0" max="20" inputmode="numeric" id="h${m.id}" value="${t?t.home_goals:""}" aria-label="Gole ${esc(m.home)}"><span>:</span><input type="number" min="0" max="20" inputmode="numeric" id="a${m.id}" value="${t?t.away_goals:""}" aria-label="Gole ${esc(m.away)}"></div>`;
    bot=`<span id="ok${m.id}" class="ok">${t?"Zapisano. Możesz zmienić typ do startu meczu.":""}</span><button data-act="tip" data-id="${m.id}">Zapisz typ</button>`}
  else if(open){mid=`<div class="fin none">– : –</div>`;bot=`<span class="sub">Zaloguj się, aby typować.</span><button data-act="login">Zaloguj</button>`}
  else{mid=`<div class="fin none">– : –</div>`;bot=`<span>${tt}</span><span class="pill">Czeka na wynik</span>`}
  const s=open?soon(m.kickoff):"",tag=s?`<span class="soon">${s}</span>`:"";
  const feat=m.featured?`<span class="featb">⭐ Mecz dnia · podwójne punkty</span>`:"";
  return`<div class="match${fin?" p"+b:""}${m.featured?" feat":""}"><div class="meta"><span><span class="time">${hm(m.kickoff)}</span>${m.round?"kolejka "+m.round:""}</span><span>${feat}${tag}</span></div><div class="row"><div class="team r">${esc(m.home)}</div>${mid}<div class="team">${esc(m.away)}</div></div>${m.featured&&!fin?`<p class="featn">Za dokładny wynik <b>8 pkt</b>, za trafionego zwycięzcę lub remis <b>6 pkt</b>.</p>`:""}<div class="res">${bot}</div><div id="fc${m.id}">${fcHTML(m)}</div>${cbar(m)}</div>`}

async function loadCounts(){

async function loadComments(mid){
  const {data,error}=await sb.from("match_comments").select("id,user_id,parent_id,body,created_at,profiles(nick,is_admin,is_moderator)").eq("match_id",mid).order("created_at").limit(300);
  if(error)return;
  await ensureLevels((data||[]).map(c=>c.user_id));
  S.cData[mid]=data||[];S.cCount[mid]=(data||[]).length;
  const ids=(data||[]).map(c=>c.id);
  if(ids.length){const rp=await sb.from("comment_reports").select("comment_id,reporter_id").in("comment_id",ids);
    (rp.data||[]).forEach(r=>{if(r.reporter_id==S.user.id)S.cRepd.add(r.comment_id)});
    S.cRep={...S.cRep};ids.forEach(i=>delete S.cRep[i]);(rp.data||[]).forEach(r=>S.cRep[r.comment_id]=(S.cRep[r.comment_id]||0)+1)}
  if(isStaff()){const mu=await sb.from("chat_mutes").select("user_id,until");S.mutes=mu.data||[]}
  drawComments(mid)}
function drawComments(mid){
  const el=$("#cli"+mid);if(!el)return;
  const ae=document.activeElement;
  if(ae&&ae.tagName=="SELECT"&&el.contains(ae))return;
  let foc=null;if(ae&&ae.tagName=="INPUT"&&el.contains(ae))foc={key:ae.dataset.key,pos:ae.selectionStart};
  el.innerHTML=cList(mid);
  if(foc){const i=el.querySelector(`input[data-key="${foc.key}"]`);if(i){i.focus();try{i.setSelectionRange(foc.pos,foc.pos)}catch(_){}}}
  const b=document.querySelector(`[data-act="ctog"][data-id="${mid}"]`);if(b)b.textContent=`💬 Komentarze (${S.cCount[mid]||0}) – ukryj`}
function cForm(mid,pid,key){return`<form class="cform rf" data-mid="${mid}" data-pid="${pid}"><input data-key="${key}" maxlength="500" autocomplete="off" placeholder="Napisz odpowiedź…" aria-label="Odpowiedź" value="${esc(S.cDraft[key]||"")}"><button type="submit">Wyślij</button><button type="button" class="ghost" data-act="crcancel" data-id="${mid}">Anuluj</button></form>`}
function cItem(mid,c,top){
  const p=c.profiles||{},mine=c.user_id==S.user.id,isS=p.is_admin||p.is_moderator,rc=S.cRep[c.id]||0;
  const badge=p.is_admin?`<span class="bdg o">Organizator</span>`:p.is_moderator?`<span class="bdg a">Administrator</span>`:"";
  const t=new Date(c.created_at),ts=t.toDateString()==new Date().toDateString()?hm(c.created_at):t.toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const body=esc(c.body).replace(/^(@\S+)/,'<span class="at">$1</span>');
  let acts=`<button class="lnk" data-act="crep" data-id="${c.id}" data-mid="${mid}" data-top="${top||c.id}" data-nick="${esc(p.nick||"")}">Odpowiedz</button>`;
  if(!mine&&!isS)acts+=S.cRepd.has(c.id)?`<span>Zgłoszono</span>`:`<button class="lnk" data-act="crpt" data-id="${c.id}" data-mid="${mid}">Zgłoś</button>`;
  if(mine||isStaff())acts+=`<button class="lnk bad" data-act="cdel2" data-id="${c.id}" data-mid="${mid}">Usuń</button>`;
  if(isStaff()&&rc)acts+=`<b style="color:var(--bad)">Zgłoszenia: ${rc}</b>`;
  if(isStaff()&&!mine&&!isS){
    const n=muteCount(c.user_id),next=[1,6,12,24][Math.min(n,3)],am=activeMute(c.user_id);
    acts+=am?`<span>Wyciszony do ${esc(fmtT(am.until))}</span><button class="lnk" data-act="cunmute" data-uid="${c.user_id}" data-mid="${mid}">Zdejmij</button>`
      :`<select id="cmt${c.id}" aria-label="Czas wyciszenia">${[1,6,12,24].map(h=>`<option value="${h}" ${h==next?"selected":""}>${h} h</option>`).join("")}</select><button class="lnk bad" data-act="cmute" data-id="${c.id}" data-mid="${mid}" data-uid="${c.user_id}" data-nick="${esc(p.nick||"")}">Wycisz</button><span>wyciszany wcześniej: ${n}×</span>`}
  return`<div class="cmt${mine?" mine":""}${isStaff()&&rc?" rep":""}"><div class="mh"><button class="nickb" data-act="pview" data-nick="${esc(p.nick||"")}" title="Zobacz profil">${esc(p.nick||"?")}</button>${lvTag(c.user_id)}${badge}<time>${esc(ts)}</time></div><div class="mb">${body}</div><div class="ma">${acts}</div></div>`}
function cList(mid){
  const all=S.cData[mid];
  if(!all)return`<p class="sub">Ładowanie komentarzy…</p>`;
  const tops=all.filter(c=>!c.parent_id).reverse();
  if(!tops.length)return`<p class="sub">Brak komentarzy. Napisz pierwszy.</p>`;
  const rp=S.cReply[mid],muted=!!S.myMute&&new Date(S.myMute)>Date.now();
  return(muted?`<p class="err">Jesteś wyciszony do ${esc(fmtT(S.myMute))}. Możesz czytać komentarze, ale nie możesz pisać.</p>`:"")+tops.map(c=>{
    const rs=all.filter(r=>r.parent_id==c.id);
    return cItem(mid,c)+`<div class="crepl">${rs.map(r=>cItem(mid,r,c.id)).join("")}${rp&&rp.pid==c.id?cForm(mid,c.id,"r"+mid):""}</div>`}).join("")}
async function toggleComments(mid){
  if(S.cOpen.has(mid))S.cOpen.delete(mid);else S.cOpen.add(mid);
  render();
  if(S.cOpen.has(mid)){await loadMyMute();await loadComments(mid)}
  cPoll()}
async function loadMyMute(){
  if(!S.user)return;
  const r=await sb.from("chat_mutes").select("until").eq("user_id",S.user.id).gt("until",new Date().toISOString()).order("until",{ascending:false}).limit(1);

let cTimer=null;
function cPoll(){
  if(S.cOpen.size&&!cTimer)cTimer=setInterval(()=>{if(document.visibilityState!="visible"||S.tab!="mecze"||!S.cOpen.size)return;S.cOpen.forEach(id=>loadComments(id))},20000);

  soCh=sb.channel("social").on("postgres_changes",{event:"*",schema:"public",table:"direct_messages"},()=>socialTick()).on("postgres_changes",{event:"*",schema:"public",table:"friendships"},()=>socialTick()).on("postgres_changes",{event:"*",schema:"public",table:"notifications"},()=>socialTick()).subscribe()}

document.addEventListener("click",async e=>{
  if(S.bell&&!e.target.closest(".bellwrap")){S.bell=false;drawBell()}

  if(a=="nopen"){const t=b.dataset.type,uid=b.dataset.uid,nick=b.dataset.nick,ref=+b.dataset.ref;
    S.bell=false;const n=S.notifs.find(x=>x.id==id);if(n&&!n.read_at){n.read_at=new Date().toISOString();sb.from("notifications").update({read_at:n.read_at}).eq("id",id).then(()=>{})}
    if(t=="dm"&&uid){S.cDraft.dm=S.dm&&S.dm.id==uid?S.cDraft.dm:"";S.dm={id:uid,nick};S.dmMsgs=[];S.tab="znajomi";render();await loadDM();drawDM(true);window.scrollTo(0,0);return}
    if(t=="comment_reply"&&ref){S.tab="mecze";S.cOpen.add(ref);render();await loadComments(ref);cPoll();const c=document.querySelector(`[data-act="ctog"][data-id="${ref}"]`);if(c)c.scrollIntoView({block:"center"});return}
    if(t=="exact_hit"){S.tab="mecze";render();window.scrollTo(0,0);return}

    if(error&&!/duplicate/i.test(error.message))alert("Nie udało się wysłać zaproszenia (możliwy limit 30 oczekujących zaproszeń).");
    await loadFriends();return render()}
  if(a=="facc"){await sb.from("friendships").update({status:"accepted"}).eq("id",id);await loadFriends();updBadge();return render()}
  if(a=="fdec"){await sb.from("friendships").delete().eq("id",id);await loadFriends();updBadge();return render()}
  if(a=="funf"){if(!confirm(`Usunąć ${b.dataset.nick} ze znajomych? Nie będziecie mogli do siebie pisać.`))return;
    await sb.from("friendships").delete().eq("id",id);if(S.dm&&S.dm.id==b.dataset.uid)S.dm=null;await loadFriends();return render()}
  if(a=="dmopen"){if(!S.dm||S.dm.id!=b.dataset.uid){S.cDraft.dm=""}S.dm={id:b.dataset.uid,nick:b.dataset.nick};S.dmMsgs=[];S.tab="znajomi";render();await loadDM();drawDM(true);window.scrollTo(0,0);return}
  if(a=="dmback"){S.dm=null;return render()}
  if(a=="dmdel"){await sb.from("direct_messages").delete().eq("id",id);return loadDM()}
  if(a=="ctog")return toggleComments(id);
  if(a=="crep"){S.cReply[+b.dataset.mid]={pid:+b.dataset.top,nick:b.dataset.nick};
    const mid=+b.dataset.mid,top=+b.dataset.top;
    if(+b.dataset.id!=top&&!S.cDraft["r"+mid])S.cDraft["r"+mid]="@"+b.dataset.nick+" ";
    drawComments(mid);const i=document.querySelector(`#cli${mid} input[data-key="r${mid}"]`);if(i){i.focus();const l=i.value.length;i.setSelectionRange(l,l)}return}
  if(a=="crcancel"){delete S.cReply[id];delete S.cDraft["r"+id];return drawComments(id)}

    if(!error||/duplicate/i.test(error.message)){S.cRepd.add(id);drawComments(+b.dataset.mid)}return}

    if(error)return alert("Nie udało się wyciszyć.");return loadComments(+b.dataset.mid)}
  if(a=="cunmute"){await sb.from("chat_mutes").update({until:new Date().toISOString()}).eq("user_id",b.dataset.uid).gt("until",new Date().toISOString());return loadComments(+b.dataset.mid)}

  if(a=="ccdis"){await sb.from("comment_reports").delete().eq("comment_id",id);await loadCRepList();return drawCRep()}
  if(a=="rep"){const {error}=await sb.from("chat_reports").insert({message_id:id,reporter_id:S.user.id});
    if(!error||/duplicate/i.test(error.message)){S.reported.add(id);drawChat(true)}return}
  if(a=="cdel"){if(!confirm("Usunąć tę wiadomość?"))return;await sb.from("chat_messages").delete().eq("id",id);return loadChat()}
  if(a=="mute"){const hrs=+$("#mt"+id).value;if(!confirm(`Wyciszyć ${b.dataset.nick} na ${hrs} h?`))return;
    const {error}=await sb.from("chat_mutes").insert({user_id:b.dataset.uid,until:new Date(Date.now()+hrs*36e5).toISOString(),hours:hrs,created_by:S.user.id});
    if(error)return alert("Nie udało się wyciszyć.");return loadChat()}
  if(a=="unmute"){await sb.from("chat_mutes").update({until:new Date().toISOString()}).eq("user_id",b.dataset.uid).gt("until",new Date().toISOString());return loadChat()}
  if(a=="tip"){const h=$("#h"+id).value,aw=$("#a"+id).value,ok=$("#ok"+id);

    const {error}=await sb.from("predictions").upsert({user_id:S.user.id,match_id:id,home_goals:+h,away_goals:+aw,updated_at:new Date().toISOString()},{onConflict:"user_id,match_id"});
    if(error)return say(ok,"Nie udało się zapisać. Mecz mógł się już zacząć.",1);

    S.tips[id]={home_goals:+h,away_goals:+aw};drawBell();return say(ok,"Zapisano. Możesz zmienić typ do startu meczu.")}
  if(a=="res"){const h=$("#rh"+id).value,aw=$("#ra"+id).value;

    const {error}=await sb.from("matches").update({home_goals:h===""?null:+h,away_goals:aw===""?null:+aw}).eq("id",id);
    if(error)return alert("Nie udało się zapisać wyniku.");S.editing.delete(id);return load()}
  if(a=="redit"){if(!confirm("Czy na pewno chcesz edytować zatwierdzony wynik tego meczu? Po zapisaniu zmiany punkty graczy zostaną przeliczone."))return;S.editing.add(id);return render()}
  if(a=="rcancel"){S.editing.delete(id);return render()}
  if(a=="feat"){const m=S.matches.find(x=>x.id==id);if(!m)return;const {error}=await sb.from("matches").update({featured:!m.featured}).eq("id",id);if(error)return alert("Nie udało się zmienić. Czy uruchomiono SQL „Mecz dnia”?");return load()}

    const {error}=await sb.auth.updateUser({email:mail});if(error)return say(m,plErr(error.message),1);
    e.target.reset();return say(m,"Wysłaliśmy link potwierdzający na nowy adres. Kliknij go, aby dokończyć zmianę.")}
  if(e.target.id=="pwf"){const m=$("#mp"),a=f.get("pw"),b2=f.get("pw2");
    if(a!==b2)return say(m,"Hasła nie są takie same.",1);
    const {error}=await sb.auth.updateUser({password:a});if(error)return say(m,plErr(error.message),1);
    e.target.reset();return say(m,"Hasło zmienione.")}
  if(e.target.id=="dlf"){const m=$("#md");
    if((f.get("confirm")||"").trim()!==S.me?.nick)return say(m,"Wpisany nick nie zgadza się z Twoim.",1);
    if(!confirm("Na pewno usunąć konto? Tej operacji nie da się cofnąć."))return;
    const {error}=await sb.rpc("delete_my_account");if(error)return say(m,plErr(error.message),1);
    S.prof=null;S.tab="mecze";await sb.auth.signOut();alert("Konto zostało usunięte.");return}
  if(e.target.id=="af"){const am=$("#am"),email=f.get("email").trim(),pw=f.get("pw");
    if(S.mode=="up"){const nick=(f.get("nick")||"").trim();if(!f.get("ok"))return say(am,"Zaznacz zgodę: 18+, regulamin i polityka prywatności.",1);
      if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{nick},captchaToken:tsTake()||undefined}});if(error)return say(am,plErr(error.message),1);
      if(!data.session){say(am,"Sprawdź skrzynkę i kliknij link potwierdzający. Potem możesz się zalogować.");return}}
    else{if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
      const {error}=await sb.auth.signInWithPassword({email,password:pw,options:{captchaToken:tsTake()||undefined}});if(error)return say(am,plErr(error.message),1)}
    S.tab="mecze"}
  if(e.target.id=="rf"){const am=$("#am");if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
    const {error}=await sb.auth.resetPasswordForEmail(f.get("email").trim(),{redirectTo:location.origin,captchaToken:tsTake()||undefined});
    if(error)return say(am,plErr(error.message),1);
    return say(am,"Jeśli konto z tym adresem istnieje, wysłaliśmy link do resetu hasła. Sprawdź też spam.")}
  if(e.target.id=="nf"){const am=$("#am"),{error}=await sb.auth.updateUser({password:f.get("pw")});
    if(error)return say(am,plErr(error.message),1);
    S.mode="in";S.tab="mecze";history.replaceState(null,"",location.pathname);return load()}
  if(e.target.id=="cf"){const inp=$("#ci"),msg=$("#cm"),body=inp.value.trim();
    if(!body)return;
    if(LINK_RE.test(body))return say(msg,"Linki i adresy stron są niedozwolone.",1);
    const {error}=await sb.from("chat_messages").insert({user_id:S.user.id,body});
    if(error)return say(msg,"Nie udało się wysłać. Odczekaj kilka sekund między wiadomościami albo sprawdź, czy nie jesteś wyciszony.",1);
    inp.value="";say(msg,"");await loadChat();const el=$("#cl");if(el)el.scrollTop=el.scrollHeight}
  if(e.target.id=="mf"){const mm=$("#mm");S.ml=f.get("league");S.mr=f.get("round")||"";S.mk=f.get("kickoff")||"";
    const {error}=await sb.from("matches").insert({league_id:+f.get("league"),round:f.get("round")?+f.get("round"):null,home:f.get("home").trim(),away:f.get("away").trim(),kickoff:new Date(f.get("kickoff")).toISOString()});
    if(error)return say(mm,"Nie udało się dodać meczu.",1);await load();say($("#mm"),"Dodano.")}});

sb.auth.onAuthStateChange((ev,s)=>{S.user=s?.user||null;if(ev=="PASSWORD_RECOVERY"){S.tab="auth";S.mode="newpw"}setTimeout(load,0)});
if(/^#(regulamin|polityka)$/.test(location.hash))S.tab=location.hash.slice(1);
render();
</script>
</body>
</html>
