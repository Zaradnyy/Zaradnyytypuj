<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typerkowo – typuj mecze dla zabawy</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%20fill%3D%22%23fff%22%2F%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22%2314201A%22%3E%3Cpolygon%20points%3D%2250.0%2C35.0%2064.3%2C45.4%2058.8%2C62.1%2041.2%2C62.1%2035.7%2C45.4%22%2F%3E%3Cpolygon%20points%3D%2270.6%2C21.7%2067.3%2C11.6%2075.9%2C5.4%2084.4%2C11.6%2081.2%2C21.7%22%2F%3E%3Cpolygon%20points%3D%2283.3%2C60.8%2091.8%2C54.6%20100.4%2C60.8%2097.1%2C70.9%2086.6%2C70.9%22%2F%3E%3Cpolygon%20points%3D%2250.0%2C85.0%2058.6%2C91.2%2055.3%2C101.3%2044.7%2C101.3%2041.4%2C91.2%22%2F%3E%3Cpolygon%20points%3D%2216.7%2C60.8%2013.4%2C70.9%202.9%2C70.9%20-0.4%2C60.8%208.2%2C54.6%22%2F%3E%3Cpolygon%20points%3D%2229.4%2C21.7%2018.8%2C21.7%2015.6%2C11.6%2024.1%2C5.4%2032.7%2C11.6%22%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%22%2314201A%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%3E%3Cline%20x1%3D%2250.0%22%20y1%3D%2235.0%22%20x2%3D%2250.0%22%20y2%3D%2217.0%22%2F%3E%3Cline%20x1%3D%2264.3%22%20y1%3D%2245.4%22%20x2%3D%2281.4%22%20y2%3D%2239.8%22%2F%3E%3Cline%20x1%3D%2258.8%22%20y1%3D%2262.1%22%20x2%3D%2269.4%22%20y2%3D%2276.7%22%2F%3E%3Cline%20x1%3D%2241.2%22%20y1%3D%2262.1%22%20x2%3D%2230.6%22%20y2%3D%2276.7%22%2F%3E%3Cline%20x1%3D%2235.7%22%20y1%3D%2245.4%22%20x2%3D%2218.6%22%20y2%3D%2239.8%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%20fill%3D%22none%22%20stroke%3D%22%231E6B45%22%20stroke-width%3D%226%22%2F%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--card:#fff;--ink:#12201A;--mute:#5B6B62;--line:#CBD6CF;--green:#1E6B45;--gi:#fff;--gold:#F2C230;--goldi:#3a2c00;--bad:#A8362B;--silver:#C3CBC6;--bronze:#C98B5A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1713;--card:#17231D;--ink:#E8F0EB;--mute:#93A59B;--line:#2B3B33;--green:#4FB07F;--gi:#06130c;--bad:#E57C70;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:1120px;margin:0 auto;padding:6px 16px 56px}
body{padding-bottom:76px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.layout.one{max-width:760px}
.aside{display:none}
@media (min-width:1320px){.layout:not(.one){grid-template-columns:minmax(0,1fr) 320px}.aside{display:block;position:sticky;top:24px;align-self:start}}
.aside .prizebar{margin:16px 0 14px;flex-direction:column;align-items:flex-start}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.acard h3{font-size:18px;margin-bottom:8px}
ol.mini{list-style:none;margin:0 0 10px;padding:0}
ol.mini li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
ol.mini li.you{background:color-mix(in srgb,var(--gold) 28%,transparent)}
.mp{font:800 16px "Bricolage Grotesque",sans-serif;width:22px}.mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);margin:4px 0 0}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{font:600 15px "Source Sans 3",system-ui,sans-serif;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--green);color:var(--gi)}
button.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}button.del{background:var(--bad);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* górny pasek: nazwa + zakładki */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px 8px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-.02em}
.brandbtn{background:none;color:var(--ink);padding:0;font:inherit;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;background:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%20fill%3D%22%23fff%22%2F%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22%2314201A%22%3E%3Cpolygon%20points%3D%2250.0%2C35.0%2064.3%2C45.4%2058.8%2C62.1%2041.2%2C62.1%2035.7%2C45.4%22%2F%3E%3Cpolygon%20points%3D%2270.6%2C21.7%2067.3%2C11.6%2075.9%2C5.4%2084.4%2C11.6%2081.2%2C21.7%22%2F%3E%3Cpolygon%20points%3D%2283.3%2C60.8%2091.8%2C54.6%20100.4%2C60.8%2097.1%2C70.9%2086.6%2C70.9%22%2F%3E%3Cpolygon%20points%3D%2250.0%2C85.0%2058.6%2C91.2%2055.3%2C101.3%2044.7%2C101.3%2041.4%2C91.2%22%2F%3E%3Cpolygon%20points%3D%2216.7%2C60.8%2013.4%2C70.9%202.9%2C70.9%20-0.4%2C60.8%208.2%2C54.6%22%2F%3E%3Cpolygon%20points%3D%2229.4%2C21.7%2018.8%2C21.7%2015.6%2C11.6%2024.1%2C5.4%2032.7%2C11.6%22%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%22%2314201A%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%3E%3Cline%20x1%3D%2250.0%22%20y1%3D%2235.0%22%20x2%3D%2250.0%22%20y2%3D%2217.0%22%2F%3E%3Cline%20x1%3D%2264.3%22%20y1%3D%2245.4%22%20x2%3D%2281.4%22%20y2%3D%2239.8%22%2F%3E%3Cline%20x1%3D%2258.8%22%20y1%3D%2262.1%22%20x2%3D%2269.4%22%20y2%3D%2276.7%22%2F%3E%3Cline%20x1%3D%2241.2%22%20y1%3D%2262.1%22%20x2%3D%2230.6%22%20y2%3D%2276.7%22%2F%3E%3Cline%20x1%3D%2235.7%22%20y1%3D%2245.4%22%20x2%3D%2218.6%22%20y2%3D%2239.8%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2246%22%20fill%3D%22none%22%20stroke%3D%22%231E6B45%22%20stroke-width%3D%226%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;flex:none}
.me{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nick{font-weight:700}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;min-width:0;background:none;color:var(--mute);border-radius:0;padding:9px 1px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav button[aria-current="page"]{color:var(--green)}
@media (min-width:960px){
  body{padding-bottom:0}
  .top,.bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:244px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px 18px;z-index:15;overflow-y:auto}
  .side .brand{font-size:27px}.side .logo{width:30px;height:30px}.side .brandbtn{padding:0 8px}
  .side nav{display:flex;flex-direction:column;gap:4px;margin-top:28px}
  .side nav button{display:flex;align-items:center;gap:14px;background:none;color:var(--mute);border-radius:10px;padding:12px 14px;font-size:17px;font-weight:600;text-align:left;white-space:nowrap}
  .side nav button:hover{background:var(--bg);color:var(--ink)}
  .side nav button[aria-current="page"]{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--ink);box-shadow:inset 4px 0 0 var(--gold)}
  .side nav button[aria-current="page"] .ic{color:var(--green)}
  .sideme{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .sideme .nick{display:block;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sideme button{width:100%}
  .wrap{max-width:none;margin:0;padding:6px 40px 56px 284px}
  .layout{max-width:1180px;margin:0 auto}
  .layout.one{max-width:760px}
}

/* baner nagrody */
.prizebar{display:flex;gap:14px;align-items:center;background:var(--green);color:var(--gi);border-radius:14px;padding:14px 16px;margin:16px 0 12px}
.pbadge{background:var(--gold);color:var(--goldi);border-radius:12px;padding:8px 12px;font:800 20px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.prizebar span{font-size:15px}

/* ligi i mecze */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.chip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;white-space:nowrap;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--green);color:var(--gi);border-color:var(--green)}
.sec{margin:26px 0 4px;font-size:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.lg{margin:22px 0 4px;font-size:22px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.day{margin:14px 0 6px;color:var(--mute);font-weight:600;font-size:14px}
.match{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px 14px;margin-bottom:10px}
.match.p4{border-left-color:var(--gold)}.match.p3{border-left-color:var(--green)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:10px;gap:8px;min-height:26px}
.meta .time{font:800 18px "Bricolage Grotesque",sans-serif;color:var(--ink);margin-right:8px}
.soon{background:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:13px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}.team.r{text-align:right}
.score{display:flex;align-items:center;gap:6px}
.score input{width:52px;height:52px;text-align:center;font:800 24px "Bricolage Grotesque",sans-serif;padding:0;border-radius:12px;border-width:2px}
.fin{font:800 26px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;min-width:84px;text-align:center;padding:6px 12px;border-radius:12px;background:var(--ink);color:var(--bg)}
.fin.none{background:var(--line);color:var(--mute)}
.res{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;min-height:34px}
.pill{border-radius:99px;padding:2px 10px;font-weight:600;font-size:14px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.p4{background:var(--gold);color:var(--goldi)}.pill.p3{background:var(--green);color:var(--gi)}
.ok{color:var(--green);font-size:14px}.err{color:var(--bad);font-size:14px}
@media (max-width:420px){.team{font-size:15px}.score input{width:46px;height:46px;font-size:22px}.row{gap:8px}.fin{min-width:72px;font-size:22px}}

/* ranking */
.podium{display:flex;gap:10px;align-items:flex-end;margin:6px 0 20px}
.pod{flex:1;min-width:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pod .info{padding:14px 6px 12px}
.pod.you{box-shadow:0 0 0 2px var(--gold)}
.pod .md{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 20px "Bricolage Grotesque",sans-serif;color:#12201A}
.pod .pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{font:800 24px "Bricolage Grotesque",sans-serif;line-height:1.1;margin-top:2px}
.pod .ps{color:var(--mute);font-size:13px}
.pod.r1 .md,.pod.r1 .step{background:var(--gold)}.pod.r2 .md,.pod.r2 .step{background:var(--silver)}.pod.r3 .md,.pod.r3 .step{background:var(--bronze)}
.podium.plain .md,.podium.plain .step{background:var(--line)}
.note.nprize{border-left-color:var(--green);color:var(--ink);margin-bottom:12px}.note{margin:0 0 12px}
.pod.r1 .step{height:44px}.pod.r2 .step{height:28px}.pod.r3 .step{height:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:14px}
.n{text-align:right}.pos{font:800 18px "Bricolage Grotesque",sans-serif;width:44px}
tr.you td{background:color-mix(in srgb,var(--gold) 28%,transparent);font-weight:600}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;margin-top:16px}
.box label{display:block;margin:10px 0 4px;font-weight:600}.box input:not([type=checkbox]){width:100%}.box .chk{display:flex;gap:8px;font-weight:400;align-items:flex-start}
.box button{margin-top:6px}
.prize{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 28px "Bricolage Grotesque",sans-serif;background:var(--gold);color:var(--goldi)}
.prize p{margin:2px 0 0;color:var(--mute)}.note{background:var(--card);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;color:var(--mute);font-size:15px}
.adm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.adm .score input{width:42px;height:40px;font-size:18px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}


/* komentarze do meczów */
.cbar{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cbtn{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}
.cbtn:hover{color:var(--text,inherit);text-decoration:underline}
.cpanel{margin-top:8px}
.cform{display:flex;gap:8px;margin:6px 0 10px}.cform input{flex:1;min-width:0}
.cform.rf{margin:6px 0 6px 0}
.cmt{padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--line) 35%,transparent);margin-bottom:6px}
.cmt.mine{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.cmt.rep{outline:2px solid var(--bad)}
.cmt .mb{white-space:pre-wrap}
.cmt .at{font-weight:700}
.crepl{margin:0 0 8px 18px;padding-left:10px;border-left:3px solid var(--line)}
.cmore{font-size:13px;color:var(--mute);margin:4px 0}
.crl{margin-top:14px}.crl .cmt{margin-bottom:8px}


/* znajomi i wiadomości prywatne */
.nbadge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-style:normal;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.bnav button{position:relative}.bnav .nbadge{position:absolute;top:3px;left:calc(50% + 6px)}
.side nav .nbadge{margin-left:auto}
.frwrap{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:12px;align-items:start}
.frcol,.dmcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.frcol h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.frcol h3:first-child{margin-top:0}
.fitem{display:flex;align-items:center;gap:8px;width:100%;background:none;color:inherit;text-align:left;padding:9px 10px;border-radius:10px;font-weight:600}
.fitem:hover,.fitem[aria-current="true"]{background:color-mix(in srgb,var(--green) 12%,transparent)}
.fitem .nbadge{margin-left:auto}
.frreq{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 4px;flex-wrap:wrap}
.frreq .ab{display:flex;gap:6px}.frreq button{padding:6px 10px;font-size:13px}
.dmhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.dml{height:min(50vh,440px);overflow-y:auto;padding:4px}
.dmm{max-width:82%;padding:7px 11px;border-radius:14px;margin-bottom:6px;background:color-mix(in srgb,var(--line) 45%,transparent);overflow-wrap:anywhere;width:fit-content;white-space:pre-wrap}
.dmm.mine{margin-left:auto;background:color-mix(in srgb,var(--gold) 28%,transparent)}
.dmm time,.dmm .rd{display:block;font-size:11px;color:var(--mute);white-space:normal}
.dmm .lnk{font-size:11px}
.dmm.gone,.msg.del .mb{color:var(--mute);font-style:italic}.msg.del{padding:4px 10px}.msg.del time{font-style:normal;font-size:13px;margin-left:6px}
.dmback{display:none}
.pact{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:720px){.frwrap{grid-template-columns:1fr}.frwrap.open .frcol{display:none}.frwrap:not(.open) .dmcol{display:none}.dmback{display:inline-block}.pact{margin-left:0;width:100%}}


/* dzwoneczek */

<li>Nagroda może podlegać opodatkowaniu zgodnie z obowiązującymi przepisami. Organizator wypełnia ciążące na nim obowiązki podatkowe i może w tym celu poprosić zwycięzcę o dane niezbędne do ich realizacji.</li></ol>
<h3>6. Reklamacje</h3><ol>
<li>Reklamacje dotyczące Konkursu można zgłaszać e-mailem na adres <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a> w ciągu 14 dni od zdarzenia, którego dotyczą.</li>
<li>Organizator rozpatruje reklamację w ciągu 14 dni od jej otrzymania i informuje zgłaszającego o decyzji. Decyzja Organizatora jest ostateczna w zakresie przyznania punktów i nagrody, z zachowaniem praw wynikających z przepisów prawa.</li></ol>
<h3>7. Czat, znajomi i profile graczy</h3><ol>
<li>Serwis udostępnia zalogowanym uczestnikom ogólny czat oraz możliwość komentowania meczów (komentarz główny i odpowiedzi pod nim). Wiadomość na czacie może mieć do 300 znaków, a komentarz do 500 znaków. Wiadomości i komentarze są widoczne dla wszystkich zalogowanych uczestników. Uczestnicy mogą ponadto zapraszać się nawzajem do grona znajomych i wymieniać wiadomości prywatne (do 500 znaków) wyłącznie ze znajomymi, którzy zaakceptowali zaproszenie. Wiadomości prywatne są widoczne tylko dla nadawcy i odbiorcy, a zasady z pkt 7.2 obowiązują także w nich.</li>
<li>Na czacie, w komentarzach do meczów, w wiadomościach prywatnych oraz w opisie profilu zabronione są: wulgaryzmy i treści obraźliwe, hejt i groźby, treści dyskryminujące, spam i reklamy, linki oraz adresy stron internetowych, treści naruszające prawo lub prawa osób trzecich oraz ujawnianie danych osobowych (własnych i cudzych).</li>
<li>Uczestnik może zgłosić wiadomość lub komentarz przyciskiem „Zgłoś”. Zgłoszenia rozpatruje Organizator oraz osoby z rangą „Administrator”, czyli moderatorzy wyznaczeni przez Organizatora.</li>
<li>Moderatorzy mogą usuwać wiadomości i komentarze naruszające regulamin (usunięcie komentarza głównego usuwa także odpowiedzi pod nim), a autor może usunąć własny komentarz. Organizator może czasowo wyciszyć uczestnika (na 1, 6, 12 lub 24 godziny), w czasie którego uczestnik nie może pisać na czacie ani komentować meczów. Za kolejne naruszenia wyciszenia mogą być dłuższe. W przypadku poważnych lub powtarzających się naruszeń Organizator może wykluczyć uczestnika zgodnie z pkt 2.5.</li>
<li>Uczestnik może spersonalizować swój profil: wybrać awatar (emoji i kolor tła), dodać krótki opis (do 160 znaków), ulubioną drużynę i ligę. Są to dane dobrowolne i widoczne dla innych uczestników. Organizator i Administratorzy mogą wyczyścić awatar lub opis naruszający regulamin.</li>
<li>Nick, statystyki (m.in. punkty, skuteczność i miejsce w rankingu) oraz typy z rozpoczętych meczów są widoczne w Serwisie dla innych uczestników, także w profilu gracza. Adres e-mail nie jest widoczny dla innych uczestników.</li>
<li>W zakładce „Konto” uczestnik może zmienić nick (raz na 30 dni), adres e-mail i hasło oraz samodzielnie usunąć konto.</li></ol>
<h3>8. Dane osobowe</h3><p>Zasady przetwarzania danych osobowych opisuje <button class="lnk" data-tab="polityka">Polityka prywatności</button>.</p>
<h3>9. Postanowienia końcowe</h3><ol>
<li>Organizator nie odpowiada za przerwy w działaniu Serwisu wynikające z przyczyn technicznych niezależnych od niego ani za błędy w danych o meczach spowodowane pomyłką, o ile niezwłocznie je poprawi.</li>
<li>Organizator może zmienić regulamin z ważnych przyczyn (np. zmiana przepisów, zakresu rozgrywek lub nagród). O zmianach poinformuje w Serwisie. Zmiany nie dotyczą już rozegranych meczów.</li>
<li>Organizator może zakończyć Konkurs, informując o tym w Serwisie z co najmniej 14-dniowym wyprzedzeniem. Nagroda za zakończone miesiące zostanie przyznana.</li>
<li>W sprawach nieuregulowanych stosuje się prawo polskie.</li>
<li>Regulamin wchodzi w życie z dniem 1 grudnia 2026 r.</li></ol>`,
polityka:`<h2>Polityka prywatności</h2><p class="upd">Obowiązuje od 1 grudnia 2026 r.</p>
<h3>1. Administrator danych</h3><p>Administratorem Twoich danych osobowych jest Patryk Rajdukowski. Kontakt we wszystkich sprawach dotyczących danych: <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>.</p>
<h3>2. Jakie dane zbieramy i po co</h3>
<div style="overflow-x:auto"><table><thead><tr><th>Dane</th><th>Cel</th><th>Podstawa prawna (RODO)</th></tr></thead><tbody>
<tr><td>Adres e-mail, hasło (zapisywane w postaci zaszyfrowanej), nick</td><td>Założenie i obsługa konta, logowanie</td><td>Art. 6 ust. 1 lit. b (umowa, czyli korzystanie z Serwisu na zasadach regulaminu)</td></tr>
<tr><td>Typy, punkty, pozycja w rankingu</td><td>Prowadzenie Konkursu i rankingów</td><td>Art. 6 ust. 1 lit. b</td></tr>
<tr><td>Adres e-mail zwycięzcy</td><td>Przekazanie nagrody, kontakt</td><td>Art. 6 ust. 1 lit. b</td></tr>
<tr><td>Dane techniczne (np. adres IP, dziennik zdarzeń)</td><td>Bezpieczeństwo Serwisu i zapobieganie nadużyciom</td><td>Art. 6 ust. 1 lit. f (prawnie uzasadniony interes)</td></tr>
<tr><td>Treść korespondencji i reklamacji</td><td>Obsługa zgłoszeń</td><td>Art. 6 ust. 1 lit. f</td></tr>
<tr><td>Awatar (emoji i kolor), opis profilu, ulubiona drużyna i liga (dobrowolne)</td><td>Personalizacja profilu widocznego dla innych uczestników</td><td>Art. 6 ust. 1 lit. a (zgoda, podanie tych danych jest dobrowolne i możesz je w każdej chwili usunąć lub zmienić w zakładce „Konto”)</td></tr>
<tr><td>Wiadomości na czacie, komentarze do meczów, lista znajomych, wiadomości prywatne, zgłoszenia, informacje o wyciszeniach</td><td>Prowadzenie czatu i komentarzy, moderacja, ochrona uczestników</td><td>Art. 6 ust. 1 lit. f</td></tr>
<tr><td>Statystyki profilu (np. skuteczność typów, miejsce w rankingu)</td><td>Wyświetlanie profilu gracza w Serwisie</td><td>Art. 6 ust. 1 lit. b</td></tr>
</tbody></table></div>
<p>Podanie e-maila, hasła i nicku jest dobrowolne, ale niezbędne do założenia konta. Nick jest <b>publicznie widoczny</b> w rankingu, na czacie i w profilu gracza, wraz ze statystykami (punkty, skuteczność, miejsce w rankingu) oraz typami z rozpoczętych meczów. Nie używaj w nicku danych, których nie chcesz ujawniać. Adres e-mail nie jest widoczny dla innych uczestników.</p>
<h3>3. Komu przekazujemy dane</h3><p>Dane są przetwarzane przy pomocy dostawców usług technicznych:</p>
<ul><li><b>Supabase</b> (baza danych i logowanie),</li><li><b>Vercel</b> (hosting strony),</li><li><b>Resend</b> (wysyłka e-maili, np. potwierdzenia konta i resetu hasła),</li><li><b>Cloudflare</b> (zabezpieczenie formularzy przed botami, usługa Turnstile),</li><li><b>OVHcloud</b> (domena oraz skrzynka e-mail kontakt@typerkowo.pl).</li></ul>
<p>Część tych dostawców może przetwarzać dane poza Europejskim Obszarem Gospodarczym, w tym w USA. Wtedy odbywa się to na podstawie mechanizmów przewidzianych w RODO (np. standardowe klauzule umowne lub decyzja o odpowiednim stopniu ochrony). Nie sprzedajemy danych i nie wykorzystujemy ich do reklam.</p>
<h3>4. Jak długo przechowujemy dane</h3><p>Dane konta i typy przechowujemy do czasu usunięcia konta. Konto możesz usunąć samodzielnie w zakładce „Konto”, a wraz z nim znikają Twój profil, typy, punkty, wiadomości z czatu, komentarze, znajomi i wiadomości prywatne. Kopie zapasowe u dostawców mogą istnieć jeszcze przez krótki czas. Dane dotyczące przyznanej nagrody mogą być przechowywane dłużej, jeśli jest to potrzebne do obrony przed roszczeniami lub wynika z przepisów. Dzienniki techniczne są przechowywane przez dostawców przez krótki okres zgodnie z ich zasadami.</p>
<h3>5. Twoje prawa</h3><p>Masz prawo do: dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, przenoszenia danych oraz sprzeciwu wobec przetwarzania opartego na prawnie uzasadnionym interesie. Nick, adres e-mail i hasło możesz zmienić, a konto usunąć samodzielnie w zakładce „Konto”. W pozostałych sprawach napisz na <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>. Masz też prawo wnieść skargę do Prezesa Urzędu Ochrony Danych Osobowych (<a href="https://uodo.gov.pl" target="_blank" rel="noopener">uodo.gov.pl</a>).</p>
<h3>6. Pliki cookies i pamięć przeglądarki</h3><p>Serwis korzysta z pamięci przeglądarki (np. localStorage lub ciasteczek) wyłącznie w celach niezbędnych do działania: utrzymania sesji po zalogowaniu. Nie używamy cookies reklamowych ani analitycznych. Formularze logowania i rejestracji korzystają z zabezpieczenia Cloudflare Turnstile, które służy wyłącznie do sprawdzenia, że formularz wypełnia człowiek, i może w tym celu zapisywać dane techniczne w przeglądarce. Serwis korzysta z czcionek Google Fonts, przy czym zapytania o czcionki trafiają do serwerów Google.</p>
<h3>7. Zmiany polityki</h3><p>Polityka może być aktualizowana. O istotnych zmianach poinformujemy w Serwisie. Obowiązuje od 1 grudnia 2026 r.</p>`};

  const lg={};calc.forEach(x=>{const k=x.matches.leagues?.name||"Inne";const o=lg[k]=lg[k]||{n:0,p:0,h:0,e:0};o.n++;o.p+=x.p;if(x.b>=3)o.h++;if(x.b==4)o.e++});
  const days=S.prof?.srv?S.prof.srv.days:new Set((S.prof?.rows||[]).filter(x=>x.created_at).map(x=>new Date(x.created_at).toLocaleDateString("sv-SE"))).size;
  const dayMap={};calc.forEach(x=>{const k=new Date(x.matches.kickoff).toLocaleDateString("sv-SE");const o=dayMap[k]=dayMap[k]||{p:0,n:0,ok:0,e:0};o.p+=x.p;o.n++;if(x.b>=3)o.ok++;if(x.b==4)o.e++});

  return{calc,n,total,hit,exact,best,cur,lg,days,friends,chats,bestDay,perfect,bestExact,pending:(S.prof?.rows||[]).length-n}}

const achVal=(a,st)=>a.meta?[a.base.filter(b=>(b.f(st)||0)>=b.goal).length,a.base.length]:[a.f(st)||0,a.goal];
function calcXp(st,tips){
  const tipXp=tips*XP_TIP;let achXp=0,got=0,all=0;
  ACH_GROUPS.forEach(g=>g.items.forEach(a=>{all++;const [v,gl]=achVal(a,st);if(v>=gl){got++;achXp+=XP_DIFF[a.d].xp}}));
  const xp=tipXp+achXp;let L=1;while(xp>=xpFor(L+1))L++;
  return{xp,tips,tipXp,achXp,got,all,L,from:xpFor(L),to:xpFor(L+1)}}
function xpInfo(st){return calcXp(st,S.prof?.srv?S.prof.srv.tips:(S.prof?.rows||[]).length)}
async function ensureLevels(ids,force){
  const need=[...new Set(ids.filter(Boolean))].filter(i=>force||!S.lv[i]);if(!need.length)return;
  const {data,error}=await sb.rpc("player_levels",{uids:need});if(error)return;
  need.forEach(i=>{if(!S.lv[i])S.lv[i]={tips:0,hits:0,exacts:0,days:0,friends:0,chats:0,bestDay:0,perfect:0,bestExact:0}});
  (data||[]).forEach(r=>S.lv[r.user_id]={tips:+r.tips,hits:+r.hits,exacts:+r.exacts,days:+r.days,friends:+r.friends,chats:+r.chats,bestDay:+r.best_day||0,perfect:+r.perfect||0,bestExact:+r.best_exact||0})}
function lvTag(uid){
  const r=S.lv[uid];if(!r)return"";
  const x=calcXp({hit:r.hits,exact:r.exacts,days:r.days,friends:r.friends,chats:r.chats,bestDay:r.bestDay,perfect:r.perfect,bestExact:r.bestExact},r.tips);
  return`<span class="lvchip sm" title="Poziom ${x.L}">poz. ${x.L}</span>`}
function badgesHTML(st){
  const x=xpInfo(st),pctL=Math.round((x.xp-x.from)/(x.to-x.from)*100);
  const lvl=`<h2 class="sec">Poziom i doświadczenie</h2><div class="xpcard"><div class="lvbig" aria-label="Poziom ${x.L}"><small>poziom</small>${x.L}</div><div class="xpbody"><div class="xprow"><b>${x.xp} XP</b><span class="sub">do poziomu ${x.L+1}: ${x.to-x.xp} XP</span></div><div class="meter" aria-hidden="true"><i style="width:${pctL}%"></i></div><p class="sub xpsrc">Typy: ${x.tips} × ${XP_TIP} = ${x.tipXp} XP · Osiągnięcia: ${x.achXp} XP. Za każdy wytypowany mecz dostajesz ${XP_TIP} XP, a za osiągnięcia jednorazowy bonus.</p></div></div>`;
  const groups=ACH_GROUPS.map(g=>`<h3 class="achg">${esc(g.name)}</h3><div class="bdgs">${g.items.map(a=>{
    const [v,gl]=achVal(a,st),ok=v>=gl,df=XP_DIFF[a.d];
    return`<div class="bcard${ok?" on":""}"><div class="bi" aria-hidden="true">${a.ic}</div><div class="bl"><span class="dif ${a.d}">${df.n}</span> +${df.xp} XP</div><div class="bn">${esc(a.name)}</div><div class="bnext sub">${esc(a.desc)}</div>${ok?`<div class="okb">✓ Zdobyte</div>`:`<div class="meter" aria-hidden="true"><i style="width:${Math.round(v/gl*100)}%"></i></div><div class="bnext sub">${v}/${gl}</div>`}</div>`}).join("")}</div>`).join("");
  return lvl+`<h2 class="sec">Osiągnięcia <small class="sub">(${x.got}/${x.all})</small></h2>`+groups}

async function loadBoard(){
  const n=new Date();let from=null,to=null;
  if(S.scope=="week"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));from=d;to=new Date(d.getTime()+7*864e5)}
  if(S.scope=="month"){from=new Date(n.getFullYear(),n.getMonth(),1);to=new Date(n.getFullYear(),n.getMonth()+1,1)}
  const {data,error}=await sb.rpc("get_leaderboard",{p_league:S.bleague||null,p_from:from&&from.toISOString(),p_to:to&&to.toISOString()});
  S.board=data||[];if(error)S.err="Nie udało się wczytać rankingu."}

function groups(list,desc){return S.leagues.map(l=>({l,items:list.filter(m=>m.league_id==l.id).sort((a,b)=>(new Date(a.kickoff)-new Date(b.kickoff))*(desc?-1:1))})).filter(g=>g.items.length)}
function section(list,desc,fn){return groups(list,desc).map(g=>{let last="";return`<h3 class="lg">${flag(g.l.code)}${esc(g.l.name)}</h3>`+g.items.map(m=>{const d=dayOf(m.kickoff),h=d!=last?`<div class="day">${esc(d)}</div>`:"";last=d;return h+fn(m)}).join("")}).join("")}

function card(m){
  const open=new Date(m.kickoff)>Date.now(),t=S.tips[m.id],fin=m.home_goals!=null,p=fin?(pts(t,m)??0):0,b=fin?(base(t,m)??0):0,tt=t?`Twój typ: ${t.home_goals} : ${t.away_goals}`:"Nie typowałeś";
  let mid,bot;
  if(fin){mid=`<div class="fin">${m.home_goals} : ${m.away_goals}</div>`;bot=`<span>${tt}</span><span class="pill p${b}">+${p} pkt${m.featured?" ⭐":""}</span>`}
  else if(open&&S.user){mid=`<div class="score"><input type="number" min="0" max="20" inputmode="numeric" id="h${m.id}" value="${t?t.home_goals:""}" aria-label="Gole ${esc(m.home)}"><span>:</span><input type="number" min="0" max="20" inputmode="numeric" id="a${m.id}" value="${t?t.away_goals:""}" aria-label="Gole ${esc(m.away)}"></div>`;
    bot=`<span id="ok${m.id}" class="ok">${t?"Zapisano. Możesz zmienić typ do startu meczu.":""}</span><button data-act="tip" data-id="${m.id}">Zapisz typ</button>`}
  else if(open){mid=`<div class="fin none">– : –</div>`;bot=`<span class="sub">Zaloguj się, aby typować.</span><button data-act="login">Zaloguj</button>`}
  else{mid=`<div class="fin none">– : –</div>`;bot=`<span>${tt}</span><span class="pill">Czeka na wynik</span>`}
  const s=open?soon(m.kickoff):"",tag=s?`<span class="soon">${s}</span>`:"";
  const feat=m.featured?`<span class="featb">⭐ Mecz dnia · podwójne punkty</span>`:"";
  return`<div class="match${fin?" p"+b:""}${m.featured?" feat":""}"><div class="meta"><span><span class="time">${hm(m.kickoff)}</span>${m.round?"kolejka "+m.round:""}</span><span>${feat}${tag}</span></div><div class="row"><div class="team r">${esc(m.home)}</div>${mid}<div class="team">${esc(m.away)}</div></div>${m.featured&&!fin?`<p class="featn">Za dokładny wynik <b>8 pkt</b>, za trafionego zwycięzcę lub remis <b>6 pkt</b>.</p>`:""}<div class="res">${bot}</div><div id="fc${m.id}">${fcHTML(m)}</div>${cbar(m)}</div>`}

async function loadComments(mid){
  const {data,error}=await sb.from("match_comments").select("id,user_id,parent_id,body,created_at,profiles(nick,is_admin,is_moderator,avatar_emoji,avatar_color)").eq("match_id",mid).order("created_at").limit(300);
  if(error)return;
  await ensureLevels((data||[]).map(c=>c.user_id));
  S.cData[mid]=data||[];S.cCount[mid]=(data||[]).length;
  const ids=(data||[]).map(c=>c.id);
  if(ids.length){const rp=await sb.from("comment_reports").select("comment_id,reporter_id").in("comment_id",ids);
    (rp.data||[]).forEach(r=>{if(r.reporter_id==S.user.id)S.cRepd.add(r.comment_id)});
    S.cRep={...S.cRep};ids.forEach(i=>delete S.cRep[i]);(rp.data||[]).forEach(r=>S.cRep[r.comment_id]=(S.cRep[r.comment_id]||0)+1)}
  if(isStaff()){const mu=await sb.from("chat_mutes").select("user_id,until");S.mutes=mu.data||[]}
  drawComments(mid)}
function drawComments(mid){
  const el=$("#cli"+mid);if(!el)return;
  const ae=document.activeElement;
  if(ae&&ae.tagName=="SELECT"&&el.contains(ae))return;

function prizebar(c){const n=new Date(),d=Math.ceil((new Date(n.getFullYear(),n.getMonth()+1,1)-n)/864e5);return`<div class="prizebar ${c||""}"><div class="pbadge">${esc(PRIZE_BADGE)}</div><div><b>Nagroda miesiąca</b><br><span>${esc(PRIZE_LINE)} Do końca miesiąca: ${d} ${d==1?"dzień":"dni"}.</span></div></div>`}

function podium(top,prize){

const LINK_RE=/(https?:\/\/|www\.|[a-z0-9]\.(pl|com|net|org|eu|ru|io|tv|me|ly|cc|xyz)(\/|\s|$))/i;

const fmtT=t=>new Date(t).toLocaleString("pl-PL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
async function loadChat(light){
  if(!S.user)return;
  let {data,error}=await sb.from("chat_messages").select("id,body,created_at,user_id,deleted_at,profiles!user_id(nick,is_admin,is_moderator,avatar_emoji,avatar_color)").order("created_at",{ascending:false}).limit(60);
  if(error){console.warn("chat: brak nowych kolumn, uruchom typer-usuwanie.sql i typer-profil.sql",error.message);({data}=await sb.from("chat_messages").select("id,body,created_at,user_id,profiles!user_id(nick,is_admin,is_moderator)").order("created_at",{ascending:false}).limit(60))}
  S.chat=(data||[]).reverse();
  await ensureLevels(S.chat.map(m=>m.user_id),!light);
  if(!light){
    const now=new Date().toISOString();
    const mine=await sb.from("chat_mutes").select("until").eq("user_id",S.user.id).gt("until",now).order("until",{ascending:false}).limit(1);
    S.myMute=mine.data?.[0]?.until||null;
    const rp=await sb.from("chat_reports").select("message_id,reporter_id");
    S.reports={};S.reported=new Set();
    (rp.data||[]).forEach(r=>{S.reports[r.message_id]=(S.reports[r.message_id]||0)+1;if(r.reporter_id==S.user.id)S.reported.add(r.message_id)});
    if(isStaff()){const mu=await sb.from("chat_mutes").select("user_id,until");S.mutes=mu.data||[]}
  }
  if(!light&&isStaff()){await loadCRepList()}
  drawChat()}
function startChat(){stopChat();if(!S.user)return;loadChat();
  chTimer=setInterval(()=>{if(document.visibilityState=="visible")loadChat()},20000);
  chCh=sb.channel("chat").on("postgres_changes",{event:"*",schema:"public",table:"chat_messages"},()=>loadChat(true)).subscribe()}
function stopChat(){if(chTimer){clearInterval(chTimer);chTimer=null}if(chCh){sb.removeChannel(chCh);chCh=null}}
const muteCount=uid=>S.mutes.filter(x=>x.user_id==uid).length;
const activeMute=uid=>S.mutes.find(x=>x.user_id==uid&&new Date(x.until)>Date.now());
function chatMsg(m){
  if(m.deleted_at){const t=new Date(m.created_at),ts=t.toDateString()==new Date().toDateString()?hm(m.created_at):t.toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});return`<div class="msg del"><div class="mb"><i>Wiadomość usunięta</i> <time>${esc(ts)}</time></div></div>`}
  const p=m.profiles||{},mine=m.user_id==S.user.id,rc=S.reports[m.id]||0,isS=p.is_admin||p.is_moderator;
  const badge=p.is_admin?`<span class="bdg o">Organizator</span>`:p.is_moderator?`<span class="bdg a">Administrator</span>`:"";
  const t=new Date(m.created_at),ts=t.toDateString()==new Date().toDateString()?hm(m.created_at):t.toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  let acts="";
  if(!mine&&!isS)acts+=S.reported.has(m.id)?`<span>Zgłoszono</span>`:`<button class="lnk" data-act="rep" data-id="${m.id}">Zgłoś</button>`;
  if(isStaff()){
    if(rc)acts+=`<b style="color:var(--bad)">Zgłoszenia: ${rc}</b>`;
    acts+=`<button class="lnk bad" data-act="cdel" data-id="${m.id}">Usuń</button>`;
    if(isStaff()&&!mine&&!isS){
      const n=muteCount(m.user_id),next=[1,6,12,24][Math.min(n,3)],am=activeMute(m.user_id);
      acts+=am?`<span>Wyciszony do ${esc(fmtT(am.until))}</span><button class="lnk" data-act="unmute" data-uid="${m.user_id}">Zdejmij</button>`
        :`<select id="mt${m.id}" aria-label="Czas wyciszenia">${[1,6,12,24].map(h=>`<option value="${h}" ${h==next?"selected":""}>${h} h</option>`).join("")}</select><button class="lnk bad" data-act="mute" data-id="${m.id}" data-uid="${m.user_id}" data-nick="${esc(p.nick)}">Wycisz</button><span>wyciszany wcześniej: ${n}×</span>`}}
  return`<div class="msg${mine?" mine":""}${isStaff()&&rc?" rep":""}"><div class="mh">${avHTML(p)}<button class="nickb" data-act="pview" data-nick="${esc(p.nick||"")}" title="Zobacz profil">${esc(p.nick||"?")}</button>${lvTag(m.user_id)}${badge}<time>${esc(ts)}</time></div><div class="mb">${esc(m.body)}</div>${acts?`<div class="ma">${acts}</div>`:""}</div>`}
function drawChat(force,toBottom){
  const el=$("#cl");if(!el)return;
  const ae=document.activeElement;
  if(!force&&ae&&ae.tagName=="SELECT"&&el.contains(ae))return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<80,list=S.onlyRep?S.chat.filter(m=>S.reports[m.id]&&!m.deleted_at):S.chat;
  el.innerHTML=list.length?list.map(chatMsg).join(""):`<p class="sub" style="padding:12px">${S.onlyRep?"Brak zgłoszonych wiadomości.":"Cisza na czacie. Napisz pierwszy."}</p>`;
  if(near||toBottom)el.scrollTop=el.scrollHeight;
  const muted=!!S.myMute&&new Date(S.myMute)>Date.now();
  $("#cstat").innerHTML=muted?`<p class="err">Jesteś wyciszony do ${esc(fmtT(S.myMute))}. Możesz czytać czat, ale nie możesz pisać.</p>`:"";
  $("#ci").disabled=muted;$("#cs").disabled=muted;drawCRep()}
function chatSync(kept){
  if(S.tab=="chat"&&S.user){const i=$("#ci");if(i&&kept!=null)i.value=kept;drawChat(true,true);if(!chTimer)startChat()}else stopChat()}

async function loadNews(){const {data}=await sb.from("news").select("id,title,body,created_at").order("created_at",{ascending:false}).limit(50);S.news=data||[];if(S.tab=="nowosci")markNewsSeen()}
function newsView(){
  const adm=!!S.me?.is_admin,list=S.news||[];
  return`<h2 class="sec" style="margin-top:18px">Nowości</h2><p class="sub">Co zmieniliśmy i dodaliśmy w Typerkowie.</p>${adm?`<form id="nwf" class="box" style="max-width:none;margin-bottom:14px"><label for="nwt">Tytuł (do 120 znaków)</label><input id="nwt" name="title" maxlength="120" required autocomplete="off" placeholder="np. Nowość: profile i awatary"><label for="nwb">Opis (do 2000 znaków, enter = nowa linia)</label><textarea id="nwb" name="body" maxlength="2000" rows="4" style="width:100%"></textarea><p id="nwm" class="err"></p><button type="submit">Opublikuj</button></form>`:""}${list.length?list.map(n=>`<article class="prize" style="display:block"><h3>${esc(n.title)}</h3><p class="sub" style="margin:2px 0 8px">${esc(new Date(n.created_at).toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"}))}</p>${n.body?`<p style="white-space:pre-wrap;margin:0">${esc(n.body)}</p>`:""}${adm?`<p style="margin:8px 0 0"><button class="lnk bad" data-act="newsdel" data-id="${n.id}">Usuń wpis</button></p>`:""}</article>`).join(""):`<p class="sub">Na razie brak wpisów.</p>`}`}
function render(){
  const tabs=[["mecze","Mecze"],["ranking","Ranking"],["chat","Czat"],["profil","Profil"],["nagrody","Nagrody"],["nowosci","Nowości"],["zasady","Zasady"]];if(S.user){tabs.push(["konto","Konto"]);tabs.splice(3,0,["znajomi","Znajomi"])}if(isStaff())tabs.push(["admin","Admin"]);
  const kept=S.tab=="chat"&&$("#ci")?$("#ci").value:null;
  const bell=S.user?`<span class="bellwrap">${bellInner()}</span>`:"";
  const meBox=S.user?`<span class="nick">${esc(S.me?.nick||"")}</span><button class="ghost" data-act="out">Wyloguj</button>`:`<button data-act="login">Zaloguj</button><button class="ghost" data-act="reg">Załóż konto</button>`;
  const brand=`<h1 class="brand"><button class="brandbtn" data-tab="mecze"><span class="logo" aria-hidden="true"></span>${esc(CFG.name)}</button></h1>`;
  const items=tabs.map(t=>`<button data-tab="${t[0]}"${S.tab==t[0]?' aria-current="page"':""}>${icon(t[0])}<span>${t[1]}</span>${t[0]=="znajomi"&&badgeN()?`<i class="nbadge">${badgeN()}</i>`:t[0]=="nowosci"&&newsN()?`<i class="nbadge">${newsN()}</i>`:""}</button>`).join("");
  $("#app").innerHTML=`<aside class="side">${brand}<nav aria-label="Menu główne">${items}</nav><div class="sideme">${meBox}</div>${socials("sbar")}</aside>
  <div class="top"><div class="in"><div class="brandrow">${brand}<div class="me">${bell}${meBox}</div></div></div></div>
  <nav class="bnav" aria-label="Menu główne">${items}</nav>
  <div class="wrap">${S.user?`<div class="dtop"><span class="bellwrap">${bellInner()}</span></div>`:""}${S.err?`<p class="err">${S.err}</p>`:""}<div class="layout${S.tab=="auth"||S.tab=="admin"||S.tab=="profil"||S.tab=="konto"||S.tab=="znajomi"||S.tab=="regulamin"||S.tab=="polityka"?" one":""}"><main>${view()}</main>${aside()}</div><footer class="foot"><span>© ${esc(CFG.name)}</span><button class="lnk" data-tab="regulamin">Regulamin</button><button class="lnk" data-tab="polityka">Polityka prywatności</button><a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>${socials("ftr")}<span class="sub" style="font-size:12px">Emoji: <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a> (CC-BY 4.0)</span></footer></div>`;
  chatSync(kept);dmSync();tsSync()}

  if(e.target.id=="mf"){const mm=$("#mm");S.ml=f.get("league");S.mr=f.get("round")||"";S.mk=f.get("kickoff")||"";
    const {error}=await sb.from("matches").insert({league_id:+f.get("league"),round:f.get("round")?+f.get("round"):null,home:f.get("home").trim(),away:f.get("away").trim(),kickoff:new Date(f.get("kickoff")).toISOString()});
    if(error)return say(mm,"Nie udało się dodać meczu.",1);await load();say($("#mm"),"Dodano.")}});

sb.auth.onAuthStateChange((ev,s)=>{S.user=s?.user||null;if(ev=="PASSWORD_RECOVERY"){S.tab="auth";S.mode="newpw"}setTimeout(load,0)});
if(/^#(regulamin|polityka)$/.test(location.hash))S.tab=location.hash.slice(1);
render();
</script>
