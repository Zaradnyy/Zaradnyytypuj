<li>Jeśli mecz zostanie przełożony, Organizator zmienia termin w Serwisie, a typy pozostają ważne do nowego terminu. Jeśli mecz zostanie odwołany lub przerwany bez rozstrzygnięcia, jest anulowany i nie liczy się do rankingu.</li></ol>
<h3>4. Punktacja i ranking</h3><ol>
<li>Za każdy mecz uczestnik otrzymuje:<ul><li><b>3 punkty</b> za trafionego zwycięzcę lub remis,</li><li><b>+1 punkt</b> dodatkowo za dokładnie trafiony wynik (razem 4 punkty),</li><li><b>0 punktów</b> w pozostałych przypadkach oraz za mecz niewytypowany. Przykład: typ 3:0 przy wyniku 3:0 daje 4 punkty (3 + 1), a typ 4:0 przy wyniku 3:0 daje 3 punkty.</li></ul></li>
<li>Serwis prezentuje ranking tygodniowy, miesięczny i sezonowy oraz osobne rankingi dla poszczególnych lig. Nagroda (pkt 5) dotyczy wyłącznie rankingu miesięcznego ze wszystkich lig łącznie. Pozostałe rankingi służą zabawie i nie dają prawa do nagrody.</li>
<li>W przypadku takiej samej liczby punktów o kolejności decyduje: (a) większa liczba dokładnie trafionych wyników, (b) wcześniejsza data założenia konta.</li></ol>
<h3>5. Nagroda</h3><ol>
<li>Co miesiąc kalendarzowy Organizator przyznaje jedną nagrodę: <b>kartę podarunkową o wartości 50 zł</b>. Rodzaj karty (sklep lub usługodawcę) wybiera Organizator.</li>
<li>Nagrodę otrzymuje uczestnik z największą liczbą punktów w rankingu miesięcznym ze wszystkich lig łącznie, obejmującym mecze rozpoczęte w danym miesiącu, według zasad z pkt 4.3. Rankingi tygodniowy, sezonowy i rankingi poszczególnych lig nie dają prawa do nagrody.</li>
<li>Zwycięzca zostanie wskazany w Serwisie lub powiadomiony wiadomością e-mail w ciągu 7 dni od zakończenia miesiąca.</li>
<li>Zwycięzca powinien zgłosić się do Organizatora na adres e-mail z konta w ciągu 7 dni od powiadomienia. Brak zgłoszenia w tym terminie oznacza utratę prawa do nagrody, a nagroda nie przechodzi na kolejną osobę.</li>
<li>Nagroda zostanie przekazana w formie kodu karty na adres e-mail zwycięzcy. Nagroda nie podlega wymianie na gotówkę ani na inną nagrodę.</li>
<li>Nagroda może podlegać opodatkowaniu zgodnie z obowiązującymi przepisami. Organizator wypełnia ciążące na nim obowiązki podatkowe i może w tym celu poprosić zwycięzcę o dane niezbędne do ich realizacji.</li></ol>
<h3>6. Reklamacje</h3><ol>
<li>Reklamacje dotyczące Konkursu można zgłaszać e-mailem na adres <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a> w ciągu 14 dni od zdarzenia, którego dotyczą.</li>
<li>Organizator rozpatruje reklamację w ciągu 14 dni od jej otrzymania i informuje zgłaszającego o decyzji. Decyzja Organizatora jest ostateczna w zakresie przyznania punktów i nagrody, z zachowaniem praw wynikających z przepisów prawa.</li></ol>
<h3>7. Czat i profile graczy</h3><ol>
<li>Serwis udostępnia zalogowanym uczestnikom ogólny czat. Wiadomość może mieć do 300 znaków i jest widoczna dla wszystkich zalogowanych uczestników.</li>
<li>Na czacie zabronione są: wulgaryzmy i treści obraźliwe, hejt i groźby, treści dyskryminujące, spam i reklamy, linki oraz adresy stron internetowych, treści naruszające prawo lub prawa osób trzecich oraz ujawnianie danych osobowych (własnych i cudzych).</li>
<li>Uczestnik może zgłosić wiadomość przyciskiem „Zgłoś”. Zgłoszenia rozpatruje Organizator oraz osoby z rangą „Administrator”, czyli moderatorzy wyznaczeni przez Organizatora.</li>
<li>Moderatorzy mogą usuwać wiadomości naruszające regulamin. Organizator może czasowo wyciszyć uczestnika (na 1, 6, 12 lub 24 godziny), w czasie którego uczestnik nie może pisać na czacie. Za kolejne naruszenia wyciszenia mogą być dłuższe. W przypadku poważnych lub powtarzających się naruszeń Organizator może wykluczyć uczestnika zgodnie z pkt 2.5.</li>
<li>Nick, statystyki (m.in. punkty, skuteczność i miejsce w rankingu) oraz typy z rozpoczętych meczów są widoczne w Serwisie dla innych uczestników, także w profilu gracza. Adres e-mail nie jest widoczny dla innych uczestników.</li>
<li>W zakładce „Konto” uczestnik może zmienić nick (raz na 30 dni), adres e-mail i hasło oraz samodzielnie usunąć konto.</li></ol>
<h3>8. Dane osobowe</h3><p>Zasady przetwarzania danych osobowych opisuje <button class="lnk" data-tab="polityka">Polityka prywatności</button>.</p>
<h3>9. Postanowienia końcowe</h3><ol>
<li>Organizator nie odpowiada za przerwy w działaniu Serwisu wynikające z przyczyn technicznych niezależnych od niego ani za błędy w danych o meczach spowodowane pomyłką, o ile niezwłocznie je poprawi.</li>
<li>Organizator może zmienić regulamin z ważnych przyczyn (np. zmiana przepisów, zakresu rozgrywek lub nagród). O zmianach poinformuje w Serwisie. Zmiany nie dotyczą już rozegranych meczów.</li>
<li>Organizator może zakończyć Konkurs, informując o tym w Serwisie z co najmniej 14-dniowym wyprzedzeniem. Nagroda za zakończone miesiące zostanie przyznana.</li>
<li>W sprawach nieuregulowanych stosuje się prawo polskie.</li>
<li>Regulamin wchodzi w życie z dniem 1 grudnia 2026 r.</li></ol>`,
polityka:`<h2>Polityka prywatności</h2><p class="upd">Obowiązuje od 1 grudnia 2026 r.</p>
<h3>1. Administrator danych</h3><p>Administratorem Twoich danych osobowych jest Patryk Rajdukowski. Kontakt we wszystkich sprawach dotyczących danych: <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>.</p>
<h3>2. Jakie dane zbieramy i po co</h3>
<div style="overflow-x:auto"><table><thead><tr><th>Dane</th><th>Cel</th><th>Podstawa prawna (RODO)</th></tr></thead><tbody>
<tr><td>Adres e-mail, hasło (zapisywane w postaci zaszyfrowanej), nick</td><td>Założenie i obsługa konta, logowanie</td><td>Art. 6 ust. 1 lit. b (umowa, czyli korzystanie z Serwisu na zasadach regulaminu)</td></tr>
<tr><td>Typy, punkty, pozycja w rankingu</td><td>Prowadzenie Konkursu i rankingów</td><td>Art. 6 ust. 1 lit. b</td></tr>
<tr><td>Adres e-mail zwycięzcy</td><td>Przekazanie nagrody, kontakt</td><td>Art. 6 ust. 1 lit. b</td></tr>
<tr><td>Dane techniczne (np. adres IP, dziennik zdarzeń)</td><td>Bezpieczeństwo Serwisu i zapobieganie nadużyciom</td><td>Art. 6 ust. 1 lit. f (prawnie uzasadniony interes)</td></tr>
<tr><td>Treść korespondencji i reklamacji</td><td>Obsługa zgłoszeń</td><td>Art. 6 ust. 1 lit. f</td></tr>
<tr><td>Wiadomości na czacie, zgłoszenia wiadomości, informacje o wyciszeniach</td><td>Prowadzenie czatu, moderacja, ochrona uczestników</td><td>Art. 6 ust. 1 lit. f</td></tr>
<tr><td>Statystyki profilu (np. skuteczność typów, miejsce w rankingu)</td><td>Wyświetlanie profilu gracza w Serwisie</td><td>Art. 6 ust. 1 lit. b</td></tr>
</tbody></table></div>
<p>Podanie e-maila, hasła i nicku jest dobrowolne, ale niezbędne do założenia konta. Nick jest <b>publicznie widoczny</b> w rankingu, na czacie i w profilu gracza, wraz ze statystykami (punkty, skuteczność, miejsce w rankingu) oraz typami z rozpoczętych meczów. Nie używaj w nicku danych, których nie chcesz ujawniać. Adres e-mail nie jest widoczny dla innych uczestników.</p>
<h3>3. Komu przekazujemy dane</h3><p>Dane są przetwarzane przy pomocy dostawców usług technicznych:</p>
<ul><li><b>Supabase</b> (baza danych i logowanie),</li><li><b>Vercel</b> (hosting strony),</li><li><b>Resend</b> (wysyłka e-maili, np. potwierdzenia konta i resetu hasła),</li><li><b>Cloudflare</b> (zabezpieczenie formularzy przed botami, usługa Turnstile),</li><li><b>OVHcloud</b> (domena oraz skrzynka e-mail kontakt@typerkowo.pl).</li></ul>
<p>Część tych dostawców może przetwarzać dane poza Europejskim Obszarem Gospodarczym, w tym w USA. Wtedy odbywa się to na podstawie mechanizmów przewidzianych w RODO (np. standardowe klauzule umowne lub decyzja o odpowiednim stopniu ochrony). Nie sprzedajemy danych i nie wykorzystujemy ich do reklam.</p>
<h3>4. Jak długo przechowujemy dane</h3><p>Dane konta i typy przechowujemy do czasu usunięcia konta. Konto możesz usunąć samodzielnie w zakładce „Konto”, a wraz z nim znikają Twój profil, typy, punkty i wiadomości z czatu. Kopie zapasowe u dostawców mogą istnieć jeszcze przez krótki czas. Dane dotyczące przyznanej nagrody mogą być przechowywane dłużej, jeśli jest to potrzebne do obrony przed roszczeniami lub wynika z przepisów. Dzienniki techniczne są przechowywane przez dostawców przez krótki okres zgodnie z ich zasadami.</p>
<h3>5. Twoje prawa</h3><p>Masz prawo do: dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, przenoszenia danych oraz sprzeciwu wobec przetwarzania opartego na prawnie uzasadnionym interesie. Nick, adres e-mail i hasło możesz zmienić, a konto usunąć samodzielnie w zakładce „Konto”. W pozostałych sprawach napisz na <a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a>. Masz też prawo wnieść skargę do Prezesa Urzędu Ochrony Danych Osobowych (<a href="https://uodo.gov.pl" target="_blank" rel="noopener">uodo.gov.pl</a>).</p>
<h3>6. Pliki cookies i pamięć przeglądarki</h3><p>Serwis korzysta z pamięci przeglądarki (np. localStorage lub ciasteczek) wyłącznie w celach niezbędnych do działania: utrzymania sesji po zalogowaniu. Nie używamy cookies reklamowych ani analitycznych. Formularze logowania i rejestracji korzystają z zabezpieczenia Cloudflare Turnstile, które służy wyłącznie do sprawdzenia, że formularz wypełnia człowiek, i może w tym celu zapisywać dane techniczne w przeglądarce. Serwis korzysta z czcionek Google Fonts, przy czym zapytania o czcionki trafiają do serwerów Google.</p>
<h3>7. Zmiany polityki</h3><p>Polityka może być aktualizowana. O istotnych zmianach poinformujemy w Serwisie. Obowiązuje od 1 grudnia 2026 r.</p>`};

async function load(){
  const since=new Date(Date.now()-14*864e5).toISOString();
  const now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1),m1=new Date(now.getFullYear(),now.getMonth()+1,1);
  const [lg,mt,sd]=await Promise.all([sb.from("leagues").select("*").order("id"),sb.from("matches").select("*,leagues(code,name)").gte("kickoff",since).order("kickoff"),sb.rpc("get_leaderboard",{p_league:null,p_from:m0.toISOString(),p_to:m1.toISOString()})]);
  S.leagues=(lg.data||[]).slice().sort((a,b)=>{const i=LEAGUE_ORDER.indexOf(a.code),j=LEAGUE_ORDER.indexOf(b.code);return (i<0?99:i)-(j<0?99:j)||a.id-b.id});S.matches=mt.data||[];S.side=sd.data||[];S.err=(lg.error||mt.error)?"Nie udało się wczytać danych. Odśwież stronę.":"";
  S.tips={};S.me=null;
  if(S.user){const [p,t]=await Promise.all([sb.from("profiles").select("*").eq("id",S.user.id).single(),sb.from("predictions").select("*").eq("user_id",S.user.id)]);S.me=p.data;(t.data||[]).forEach(x=>S.tips[x.match_id]=x)}
  if(S.tab=="ranking")await loadBoard();
  if(S.tab=="profil")await loadProfile();
  render()}

async function loadProfile(){
  if(!S.user){S.prof=null;return}
  let who=S.me;
  if(S.viewNick&&S.viewNick!=S.me?.nick){
    const r=await sb.from("profiles").select("id,nick,created_at,is_admin,is_moderator").eq("nick",S.viewNick).maybeSingle();
    who=r.data;if(!who){S.prof={user:null,rows:[],all:[],notfound:true};return}}
  const [t,al]=await Promise.all([
    sb.from("predictions").select("home_goals,away_goals,matches(home,away,kickoff,home_goals,away_goals,round,league_id,leagues(name))").eq("user_id",who.id),
    sb.rpc("get_leaderboard",{p_league:null,p_from:null,p_to:null})]);
  S.prof={user:who,own:who.id==S.user.id,rows:t.data||[],all:al.data||[],err:!!t.error}}
async function openProfile(nick){S.viewNick=nick&&nick!=S.me?.nick?nick:null;S.tab="profil";S.prof=null;render();await loadProfile();render();window.scrollTo(0,0)}

function profView(){
  if(!S.user)return`<div class="box"><h2>Profil</h2><p class="sub">Zaloguj się, aby zobaczyć swój profil i statystyki.</p><button data-act="login">Zaloguj się</button> <button class="ghost" data-act="reg">Załóż konto</button></div>`;
  const sch=`<form id="pf" class="psearch" role="search"><input id="pq" name="q" type="search" maxlength="20" autocomplete="off" placeholder="Szukaj gracza po nicku" aria-label="Szukaj gracza po nicku" value="${esc(S.pq||"")}"><button type="submit" aria-label="Szukaj">${icon("lupa")}<span>Szukaj</span></button></form>`
   +(S.pres?(S.pres.length?`<div class="pres">${S.pres.map(r=>`<button data-act="pview" data-nick="${esc(r.nick)}">${esc(r.nick)}</button>`).join("")}</div>`:`<p class="sub">${esc(S.pmsg||"")}</p>`):"");
  if(!S.prof)return sch+`<p class="sub" style="margin-top:18px">Wczytuję profil…</p>`;
  if(S.prof.notfound)return sch+`<p class="note" style="margin-top:18px">Nie ma takiego gracza.</p><button class="ghost back" data-act="pview" data-nick="">Wróć do swojego profilu</button>`;
  const own=S.prof.own,st=profStats(),me=S.prof.user||{},since=me.created_at?new Date(me.created_at).toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"}):"",role=me.is_admin?`<span class="bdg o">Organizator</span>`:me.is_moderator?`<span class="bdg a">Administrator</span>`:"";
  const head=`<div class="phead"><div class="av" aria-hidden="true">${esc((me.nick||"?").charAt(0).toUpperCase())}</div><div><h2>${esc(me.nick||"")}</h2><p class="sub">${since?"Gracz od "+esc(since)+" ":""}${role}</p></div></div>`;
  const backBtn=own?"":`<button class="ghost back" data-act="pview" data-nick="">Wróć do swojego profilu</button>`;
  const rank=`<h2 class="sec">Miejsce w rankingu</h2><div class="tiles"><div class="tile"><div>${rankOf(S.side,me.nick)}</div><div class="tl">Ten miesiąc, ranking nagrodowy (wszystkie ligi)</div></div><div class="tile"><div>${rankOf(S.prof.all,me.nick)}</div><div class="tl">Cały sezon</div></div></div>`;
  if(!st.n)return sch+backBtn+head+rank+`<h2 class="sec">Statystyki</h2><p class="note">${own?"Nie masz jeszcze rozliczonych typów. Statystyki pojawią się po pierwszych zakończonych meczach.":"Ten gracz nie ma jeszcze rozliczonych typów."}${own&&st.pending?` Czeka na wynik: ${st.pending}.`:""}</p>`;
  const sk=pc(st.hit,st.n),dk=pc(st.exact,st.n);
  const tiles=`<div class="tiles">${tile(st.total,"Zdobyte punkty")}${tile(sk+"<small>%</small>","Skuteczność (trafiony zwycięzca lub remis)",sk)}${tile(dk+"<small>%</small>","Dokładne wyniki",dk)}${tile((st.total/st.n).toFixed(2).replace(".",","),"Średnio punktów na typ")}${tile(st.n,"Rozliczone typy"+(own&&st.pending?` (czeka na wynik: ${st.pending})`:""))}${tile(st.best,"Najlepsza seria trafień"+(st.cur?` (teraz: ${st.cur})`:""))}</div>`;
  const lgRows=Object.entries(st.lg).sort((a,b)=>b[1].p-a[1].p).map(([k,o])=>`<tr><td>${flagName(k)}${esc(k)}</td><td class="n">${o.n}</td><td class="n">${o.p}</td><td class="n">${pc(o.h,o.n)}%</td><td class="n">${o.e}</td></tr>`).join("");
  const lgT=`<h2 class="sec">Według lig</h2><div style="overflow-x:auto"><table><thead><tr><th>Liga</th><th class="n">Typy</th><th class="n">Pkt</th><th class="n">Skut.</th><th class="n">Dokł.</th></tr></thead><tbody>${lgRows}</tbody></table></div>`;
  const last=st.calc.slice(-8).reverse().map(x=>{const m=x.matches;return`<div class="lt"><div><b>${esc(m.home)} – ${esc(m.away)}</b><p class="sub">${flagName(m.leagues?.name)}${esc(m.leagues?.name||"")}<span class="mo"> · typ ${x.home_goals}:${x.away_goals} · wynik ${m.home_goals}:${m.away_goals}</span></p></div><span class="hide">typ ${x.home_goals}:${x.away_goals}</span><span class="hide">wynik ${m.home_goals}:${m.away_goals}</span><span class="pill p${x.p}">+${x.p} pkt</span></div>`}).join("");
  return sch+backBtn+head+rank+`<h2 class="sec">Statystyki</h2>`+tiles+`<p class="sub">Statystyki liczą się z rozegranych meczów, w których wpisano wynik.</p>`+lgT+`<h2 class="sec">${own?"Ostatnie typy":"Ostatnie typy gracza"}</h2>`+last}

async function loadBoard(){
  const n=new Date();let from=null,to=null;
  if(S.scope=="week"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));from=d;to=new Date(d.getTime()+7*864e5)}
  if(S.scope=="month"){from=new Date(n.getFullYear(),n.getMonth(),1);to=new Date(n.getFullYear(),n.getMonth()+1,1)}
  const {data,error}=await sb.rpc("get_leaderboard",{p_league:S.bleague||null,p_from:from&&from.toISOString(),p_to:to&&to.toISOString()});
  S.board=data||[];if(error)S.err="Nie udało się wczytać rankingu."}

// mecze zawsze osobno dla każdej ligi i posortowane godzinami (niezależnie od kolejności wpisywania)
function groups(list,desc){return S.leagues.map(l=>({l,items:list.filter(m=>m.league_id==l.id).sort((a,b)=>(new Date(a.kickoff)-new Date(b.kickoff))*(desc?-1:1))})).filter(g=>g.items.length)}
function section(list,desc,fn){return groups(list,desc).map(g=>{let last="";return`<h3 class="lg">${flag(g.l.code)}${esc(g.l.name)}</h3>`+g.items.map(m=>{const d=dayOf(m.kickoff),h=d!=last?`<div class="day">${esc(d)}</div>`:"";last=d;return h+fn(m)}).join("")}).join("")}

function card(m){
  const open=new Date(m.kickoff)>Date.now(),t=S.tips[m.id],fin=m.home_goals!=null,p=fin?(pts(t,m)??0):0,tt=t?`Twój typ: ${t.home_goals} : ${t.away_goals}`:"Nie typowałeś";
  let mid,bot;
  if(fin){mid=`<div class="fin">${m.home_goals} : ${m.away_goals}</div>`;bot=`<span>${tt}</span><span class="pill p${p}">+${p} pkt</span>`}
  else if(open&&S.user){mid=`<div class="score"><input type="number" min="0" max="20" inputmode="numeric" id="h${m.id}" value="${t?t.home_goals:""}" aria-label="Gole ${esc(m.home)}"><span>:</span><input type="number" min="0" max="20" inputmode="numeric" id="a${m.id}" value="${t?t.away_goals:""}" aria-label="Gole ${esc(m.away)}"></div>`;
    bot=`<span id="ok${m.id}" class="ok">${t?"Zapisano. Możesz zmienić typ do startu meczu.":""}</span><button data-act="tip" data-id="${m.id}">Zapisz typ</button>`}
  else if(open){mid=`<div class="fin none">– : –</div>`;bot=`<span class="sub">Zaloguj się, aby typować.</span><button data-act="login">Zaloguj</button>`}
  else{mid=`<div class="fin none">– : –</div>`;bot=`<span>${tt}</span><span class="pill">Czeka na wynik</span>`}
  const s=open?soon(m.kickoff):"",tag=s?`<span class="soon">${s}</span>`:"";
  return`<div class="match${fin?" p"+p:""}"><div class="meta"><span><span class="time">${hm(m.kickoff)}</span>${m.round?"kolejka "+m.round:""}</span>${tag}</div><div class="row"><div class="team r">${esc(m.home)}</div>${mid}<div class="team">${esc(m.away)}</div></div><div class="res">${bot}</div></div>`}

function admRow(m){
  const fin=m.home_goals!=null,ed=S.editing.has(m.id),lock=fin&&!ed,dis=lock?" disabled":"";
  const btns=lock?`<span class="okb">✓ Zatwierdzone</span> <button class="ghost" data-act="redit" data-id="${m.id}">Edytuj</button>`
    :`<button data-act="res" data-id="${m.id}">${ed?"Zapisz zmianę":"Zatwierdź"}</button>${ed?` <button class="ghost" data-act="rcancel" data-id="${m.id}">Anuluj</button>`:""}`;
  return`<div class="adm${lock?" done":""}"><div><b>${esc(m.home)} – ${esc(m.away)}</b><br><span class="sub">${hm(m.kickoff)}${m.round?", kolejka "+m.round:""}</span></div><div class="score"><input type="number" min="0" id="rh${m.id}" value="${m.home_goals??""}"${dis} aria-label="Gole gospodarza"><span>:</span><input type="number" min="0" id="ra${m.id}" value="${m.away_goals??""}"${dis} aria-label="Gole gościa"></div><div class="ab">${btns} <button class="del" data-act="del" data-id="${m.id}" aria-label="Usuń mecz">Usuń</button></div></div>`}

function leagueSel(id,val,all){return`<select id="${id}" aria-label="Liga">${all?`<option value="">Wszystkie ligi</option>`:""}${S.leagues.map(l=>`<option value="${all?l.code:l.id}" ${val==(all?l.code:l.id)?"selected":""}>${esc(l.name)}</option>`).join("")}</select>`}

function prizebar(c){const n=new Date(),d=Math.ceil((new Date(n.getFullYear(),n.getMonth()+1,1)-n)/864e5);return`<div class="prizebar ${c||""}"><div class="pbadge">${esc(PRIZE_BADGE)}</div><div><b>Nagroda miesiąca</b><br><span>${esc(PRIZE_LINE)} Do końca miesiąca: ${d} ${d==1?"dzień":"dni"}.</span></div></div>`}

function aside(){
  if(S.tab=="auth"||S.tab=="admin"||S.tab=="profil"||S.tab=="konto"||S.tab=="regulamin"||S.tab=="polityka")return"";
  const top=S.side.filter(r=>r.total_points>0).slice(0,5);
  const list=S.tab=="ranking"?"":`<div class="acard"><h3>Najlepsi w tym miesiącu</h3>${top.length?`<ol class="mini">${top.map((r,i)=>`<li class="${r.nick==S.me?.nick?"you":""}"><span class="mp">${i+1}</span><span class="mn"><button class="nickb" data-act="pview" data-nick="${esc(r.nick)}" title="Zobacz profil">${esc(r.nick)}</button></span><b>${r.total_points}</b></li>`).join("")}</ol><button class="ghost" data-tab="ranking">Cały ranking</button>`:`<p class="sub">Nikt jeszcze nie zdobył punktów. Zacznij pierwszy.</p>`}</div>`;
  return`<aside class="aside" style="padding-top:16px">${list}<div class="acard"><h3>Punktacja</h3><p class="sub">3 pkt za trafionego zwycięzcę lub remis.<br>+1 pkt za dokładny wynik, razem 4 pkt.</p></div></aside>`}

function podium(top,prize){
  if(!top.length)return"";
  return`<div class="podium${prize?"":" plain"}">${[1,0,2].filter(i=>top[i]).map(i=>{const r=top[i];return`<div class="pod r${i+1}${r.nick==S.me?.nick?" you":""}"><div class="info"><div class="md">${i+1}</div><div class="pn"><button class="nickb" data-act="pview" data-nick="${esc(r.nick)}" title="Zobacz profil">${esc(r.nick)}</button></div><div class="pp">${r.total_points} pkt</div><div class="ps">dokładne: ${r.exact_hits}</div></div><div class="step"></div></div>`}).join("")}</div>`}

const LINK_RE=/(https?:\/\/|www\.|[a-z0-9]\.(pl|com|net|org|eu|ru|io|tv|me|ly|cc|xyz)(\/|\s|$))/i;
let chTimer=null,chCh=null;
const isStaff=()=>!!(S.me?.is_admin||S.me?.is_moderator);
const fmtT=t=>new Date(t).toLocaleString("pl-PL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
async function loadChat(light){
  if(!S.user)return;
  const {data}=await sb.from("chat_messages").select("id,body,created_at,user_id,profiles(nick,is_admin,is_moderator)").order("created_at",{ascending:false}).limit(60);
  S.chat=(data||[]).reverse();
  if(!light){
    const now=new Date().toISOString();
    const mine=await sb.from("chat_mutes").select("until").eq("user_id",S.user.id).gt("until",now).order("until",{ascending:false}).limit(1);
    S.myMute=mine.data?.[0]?.until||null;
    const rp=await sb.from("chat_reports").select("message_id,reporter_id");
    S.reports={};S.reported=new Set();
    (rp.data||[]).forEach(r=>{S.reports[r.message_id]=(S.reports[r.message_id]||0)+1;if(r.reporter_id==S.user.id)S.reported.add(r.message_id)});
    if(isStaff()){const mu=await sb.from("chat_mutes").select("user_id,until");S.mutes=mu.data||[]}
  }
  drawChat()}
function startChat(){stopChat();if(!S.user)return;loadChat();
  chTimer=setInterval(()=>{if(document.visibilityState=="visible")loadChat()},20000);
  chCh=sb.channel("chat").on("postgres_changes",{event:"*",schema:"public",table:"chat_messages"},()=>loadChat(true)).subscribe()}
function stopChat(){if(chTimer){clearInterval(chTimer);chTimer=null}if(chCh){sb.removeChannel(chCh);chCh=null}}
const muteCount=uid=>S.mutes.filter(x=>x.user_id==uid).length;
const activeMute=uid=>S.mutes.find(x=>x.user_id==uid&&new Date(x.until)>Date.now());
function chatMsg(m){
  const p=m.profiles||{},mine=m.user_id==S.user.id,rc=S.reports[m.id]||0,isS=p.is_admin||p.is_moderator;
  const badge=p.is_admin?`<span class="bdg o">Organizator</span>`:p.is_moderator?`<span class="bdg a">Administrator</span>`:"";
  const t=new Date(m.created_at),ts=t.toDateString()==new Date().toDateString()?hm(m.created_at):t.toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  let acts="";
  if(!mine&&!isS)acts+=S.reported.has(m.id)?`<span>Zgłoszono</span>`:`<button class="lnk" data-act="rep" data-id="${m.id}">Zgłoś</button>`;
  if(isStaff()){
    if(rc)acts+=`<b style="color:var(--bad)">Zgłoszenia: ${rc}</b>`;
    acts+=`<button class="lnk bad" data-act="cdel" data-id="${m.id}">Usuń</button>`;
    if(S.me.is_admin&&!mine&&!isS){
      const n=muteCount(m.user_id),next=[1,6,12,24][Math.min(n,3)],am=activeMute(m.user_id);
      acts+=am?`<span>Wyciszony do ${esc(fmtT(am.until))}</span><button class="lnk" data-act="unmute" data-uid="${m.user_id}">Zdejmij</button>`
        :`<select id="mt${m.id}" aria-label="Czas wyciszenia">${[1,6,12,24].map(h=>`<option value="${h}" ${h==next?"selected":""}>${h} h</option>`).join("")}</select><button class="lnk bad" data-act="mute" data-id="${m.id}" data-uid="${m.user_id}" data-nick="${esc(p.nick)}">Wycisz</button><span>wyciszany wcześniej: ${n}×</span>`}}
  return`<div class="msg${mine?" mine":""}${isStaff()&&rc?" rep":""}"><div class="mh"><button class="nickb" data-act="pview" data-nick="${esc(p.nick||"")}" title="Zobacz profil">${esc(p.nick||"?")}</button>${badge}<time>${esc(ts)}</time></div><div class="mb">${esc(m.body)}</div>${acts?`<div class="ma">${acts}</div>`:""}</div>`}
function drawChat(force,toBottom){
  const el=$("#cl");if(!el)return;
  const ae=document.activeElement;
  if(!force&&ae&&ae.tagName=="SELECT"&&el.contains(ae))return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<80,list=S.onlyRep?S.chat.filter(m=>S.reports[m.id]):S.chat;
  el.innerHTML=list.length?list.map(chatMsg).join(""):`<p class="sub" style="padding:12px">${S.onlyRep?"Brak zgłoszonych wiadomości.":"Cisza na czacie. Napisz pierwszy."}</p>`;
  if(near||toBottom)el.scrollTop=el.scrollHeight;
  const muted=!!S.myMute&&new Date(S.myMute)>Date.now();
  $("#cstat").innerHTML=muted?`<p class="err">Jesteś wyciszony do ${esc(fmtT(S.myMute))}. Możesz czytać czat, ale nie możesz pisać.</p>`:"";
  $("#ci").disabled=muted;$("#cs").disabled=muted}
function chatSync(kept){
  if(S.tab=="chat"&&S.user){const i=$("#ci");if(i&&kept!=null)i.value=kept;drawChat(true,true);if(!chTimer)startChat()}else stopChat()}

  if(S.tab=="ranking"){
    const b=S.board,top=b.slice(0,3).filter(r=>r.total_points>0),k=top.length,rest=b.slice(k),prize=S.scope=="month"&&!S.bleague;
    return`<div class="bar"><select id="sc" aria-label="Okres"><option value="month" ${S.scope=="month"?"selected":""}>Ten miesiąc</option><option value="week" ${S.scope=="week"?"selected":""}>Ten tydzień</option><option value="all" ${S.scope=="all"?"selected":""}>Cały sezon</option></select>${leagueSel("lb",S.bleague,1)}</div>`+
    (prize?`<div class="note nprize"><b>Ranking nagrodowy.</b> Zwycięzca miesiąca (wszystkie ligi razem) dostaje kartę podarunkową ${esc(PRIZE_BADGE)}.</div>`
      :`<div class="note">Ten ranking jest tylko dla zabawy, bez nagrody. Nagrodę dostaje zwycięzca rankingu miesięcznego ze wszystkich lig. <button class="lnk" data-act="goprize">Pokaż ranking nagrodowy</button></div>`)+podium(top,prize)+
    (rest.length?`<div style="overflow-x:auto"><table><thead><tr><th>Miejsce</th><th>Gracz</th><th class="n">Punkty</th><th class="n">Dokładne</th><th class="n">Typy</th></tr></thead><tbody>${rest.map((r,i)=>`<tr class="${r.nick==S.me?.nick?"you":""}"><td class="pos">${k+i+1}</td><td><button class="nickb" data-act="pview" data-nick="${esc(r.nick)}" title="Zobacz profil">${esc(r.nick)}</button></td><td class="n">${r.total_points}</td><td class="n">${r.exact_hits}</td><td class="n">${r.tips_count}</td></tr>`).join("")}</tbody></table></div>`:(b.length?"":`<p class="sub">Brak graczy.</p>`))}
  if(S.tab=="profil")return profView();
  if(S.tab=="konto")return kontoView();
  if(S.tab=="regulamin"||S.tab=="polityka")return legalView(S.tab);
  if(S.tab=="nagrody")return`<h2 class="sec" style="margin-top:18px">Do wygrania</h2>${PRIZES.map(p=>`<div class="prize"><div class="medal">${esc(p[0])}</div><div><h3>${esc(p[1])}</h3><p>${esc(p[2])}</p></div></div>`).join("")}`;
  if(S.tab=="zasady")return`<h2 class="sec" style="margin-top:18px">Jak to działa</h2><ul><li><b>3 punkty</b> za trafionego zwycięzcę lub remis.</li><li><b>+1 punkt</b> dodatkowo za dokładny wynik, czyli razem <b>4 punkty</b>. Przykład: typ 3:0 i wynik 3:0 to 4 pkt, a typ 4:0 przy wyniku 3:0 to 3 pkt.</li><li>Typy możesz zmieniać do rozpoczęcia meczu. Potem są zablokowane.</li><li>Cudze typy widać dopiero po starcie meczu.</li><li>Udział jest <b>bezpłatny</b>. Co miesiąc nagradzamy gracza z największą liczbą punktów w rankingu miesięcznym ze wszystkich lig kartą podarunkową 50 zł, a nagrodę funduje organizator. Pozostałe rankingi (tygodniowy, sezonowy i dla poszczególnych lig) są tylko dla zabawy.</li><li>Przy remisie w rankingu decyduje liczba dokładnych trafień, a potem wcześniejsza data założenia konta.</li></ul><p class="note">Pełne zasady znajdziesz w dokumentach: <button class="lnk" data-tab="regulamin">Regulamin</button> i <button class="lnk" data-tab="polityka">Polityka prywatności</button>.</p>`;
  if(S.tab=="admin"&&S.me?.is_admin)return`<h2 class="sec" style="margin-top:18px">Dodaj mecz</h2><form id="mf"><div class="grid">${leagueSel("ml",S.ml||S.leagues[0]?.id,0).replace('id="ml"','id="ml" name="league"')}<input name="round" type="number" min="1" placeholder="Kolejka" value="${esc(S.mr)}"><input name="home" placeholder="Gospodarz" required><input name="away" placeholder="Gość" required><input name="kickoff" type="datetime-local" required aria-label="Start meczu" value="${esc(S.mk)}"></div><button type="submit">Dodaj mecz</button> <span id="mm"></span></form>
   <p class="sub">Mecze są automatycznie grupowane według ligi i sortowane według godziny, więc kolejność wpisywania nie ma znaczenia. Liga, kolejka i data zostają w formularzu po dodaniu meczu.</p>
   <h2 class="sec">Wyniki i mecze</h2>${section(S.matches,false,admRow)||`<p class="sub">Brak meczów.</p>`}`;
  return""}

const icon=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]||""}</svg>`;
function render(){
  const tabs=[["mecze","Mecze"],["ranking","Ranking"],["chat","Czat"],["profil","Profil"],["nagrody","Nagrody"],["zasady","Zasady"]];if(S.user)tabs.push(["konto","Konto"]);if(S.me?.is_admin)tabs.push(["admin","Admin"]);
  const kept=S.tab=="chat"&&$("#ci")?$("#ci").value:null;
  const meBox=S.user?`<span class="nick">${esc(S.me?.nick||"")}</span><button class="ghost" data-act="out">Wyloguj</button>`:`<button data-act="login">Zaloguj</button><button class="ghost" data-act="reg">Załóż konto</button>`;
  const brand=`<h1 class="brand"><button class="brandbtn" data-tab="mecze"><span class="logo" aria-hidden="true"></span>${esc(CFG.name)}</button></h1>`;
  const items=tabs.map(t=>`<button data-tab="${t[0]}"${S.tab==t[0]?' aria-current="page"':""}>${icon(t[0])}<span>${t[1]}</span></button>`).join("");
  $("#app").innerHTML=`<aside class="side">${brand}<nav aria-label="Menu główne">${items}</nav><div class="sideme">${meBox}</div></aside>
  <div class="top"><div class="in"><div class="brandrow">${brand}<div class="me">${meBox}</div></div></div></div>
  <nav class="bnav" aria-label="Menu główne">${items}</nav>
  <div class="wrap">${S.err?`<p class="err">${S.err}</p>`:""}<div class="layout${S.tab=="auth"||S.tab=="admin"||S.tab=="profil"||S.tab=="konto"||S.tab=="regulamin"||S.tab=="polityka"?" one":""}"><main>${view()}</main>${aside()}</div><footer class="foot"><span>© ${esc(CFG.name)}</span><button class="lnk" data-tab="regulamin">Regulamin</button><button class="lnk" data-tab="polityka">Polityka prywatności</button><a href="mailto:kontakt@typerkowo.pl">kontakt@typerkowo.pl</a></footer></div>`;
  chatSync(kept);tsSync()}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
  if(b.dataset.lg!==undefined){S.league=b.dataset.lg;return render()}
  if(b.dataset.tab){S.tab=b.dataset.tab;{const lg=S.tab=="regulamin"||S.tab=="polityka";if(lg){history.replaceState(null,"","#"+S.tab);window.scrollTo(0,0)}else if(/^#(regulamin|polityka)$/.test(location.hash))history.replaceState(null,"",location.pathname)}if(S.tab=="ranking")await loadBoard();if(S.tab=="profil"){S.viewNick=null;S.pq="";S.pres=null;S.prof=null;render();await loadProfile()}return render()}
  if(a=="login"||a=="reg"){S.tab="auth";S.mode=a=="reg"?"up":"in";return render()}
  if(a=="forgot"){S.tab="auth";S.mode="reset";return render()}
  if(a=="pview")return openProfile(b.dataset.nick);
  if(a=="out"){S.prof=null;await sb.auth.signOut();return}
  if(a=="goprize"){S.scope="month";S.bleague="";await loadBoard();return render()}
  if(a=="onlyrep"){S.onlyRep=!S.onlyRep;return render()}
  if(a=="rep"){const {error}=await sb.from("chat_reports").insert({message_id:id,reporter_id:S.user.id});
    if(!error||/duplicate/i.test(error.message)){S.reported.add(id);drawChat(true)}return}
  if(a=="cdel"){if(!confirm("Usunąć tę wiadomość?"))return;await sb.from("chat_messages").delete().eq("id",id);return loadChat()}
  if(a=="mute"){const hrs=+$("#mt"+id).value;if(!confirm(`Wyciszyć ${b.dataset.nick} na ${hrs} h?`))return;
    const {error}=await sb.from("chat_mutes").insert({user_id:b.dataset.uid,until:new Date(Date.now()+hrs*36e5).toISOString(),hours:hrs,created_by:S.user.id});
    if(error)return alert("Nie udało się wyciszyć.");return loadChat()}
  if(a=="unmute"){await sb.from("chat_mutes").update({until:new Date().toISOString()}).eq("user_id",b.dataset.uid).gt("until",new Date().toISOString());return loadChat()}
  if(a=="tip"){const h=$("#h"+id).value,aw=$("#a"+id).value,ok=$("#ok"+id);
    if(h===""||aw===""||h<0||aw<0||h>20||aw>20)return say(ok,"Wpisz gole od 0 do 20 dla obu drużyn.",1);
    const {error}=await sb.from("predictions").upsert({user_id:S.user.id,match_id:id,home_goals:+h,away_goals:+aw,updated_at:new Date().toISOString()},{onConflict:"user_id,match_id"});
    if(error)return say(ok,"Nie udało się zapisać. Mecz mógł się już zacząć.",1);
    S.tips[id]={home_goals:+h,away_goals:+aw};return say(ok,"Zapisano. Możesz zmienić typ do startu meczu.")}
  if(a=="res"){const h=$("#rh"+id).value,aw=$("#ra"+id).value;
    if((h===""||aw==="")&&!(h===""&&aw===""))return alert("Wpisz wynik obu drużyn.");
    const {error}=await sb.from("matches").update({home_goals:h===""?null:+h,away_goals:aw===""?null:+aw}).eq("id",id);
    if(error)return alert("Nie udało się zapisać wyniku.");S.editing.delete(id);return load()}
  if(a=="redit"){if(!confirm("Czy na pewno chcesz edytować zatwierdzony wynik tego meczu? Po zapisaniu zmiany punkty graczy zostaną przeliczone."))return;S.editing.add(id);return render()}
  if(a=="rcancel"){S.editing.delete(id);return render()}
  if(a=="del"){if(!confirm("Usunąć ten mecz razem z typami?"))return;await sb.from("matches").delete().eq("id",id);return load()}
});
document.addEventListener("change",async e=>{
  if(e.target.id=="ml")S.ml=e.target.value;
  if(e.target.id=="sc"||e.target.id=="lb"){S.scope=$("#sc").value;S.bleague=$("#lb").value;await loadBoard();render()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=new FormData(e.target);
  if(e.target.id=="pf")return searchPlayers(f.get("q")||"");
  if(e.target.id=="nkf"){const m=$("#mn"),n=(f.get("nick")||"").trim();
    const {error}=await sb.rpc("change_nick",{new_nick:n});if(error)return say(m,plErr(error.message),1);
    await load();render();const m2=$("#mn");return say(m2,"Nick zmieniony.")}
  if(e.target.id=="emf"){const m=$("#me"),mail=(f.get("email")||"").trim();
    const {error}=await sb.auth.updateUser({email:mail});if(error)return say(m,plErr(error.message),1);
    e.target.reset();return say(m,"Wysłaliśmy link potwierdzający na nowy adres. Kliknij go, aby dokończyć zmianę.")}
  if(e.target.id=="pwf"){const m=$("#mp"),a=f.get("pw"),b2=f.get("pw2");
    if(a!==b2)return say(m,"Hasła nie są takie same.",1);
    const {error}=await sb.auth.updateUser({password:a});if(error)return say(m,plErr(error.message),1);
    e.target.reset();return say(m,"Hasło zmienione.")}
  if(e.target.id=="dlf"){const m=$("#md");
    if((f.get("confirm")||"").trim()!==S.me?.nick)return say(m,"Wpisany nick nie zgadza się z Twoim.",1);
    if(!confirm("Na pewno usunąć konto? Tej operacji nie da się cofnąć."))return;
    const {error}=await sb.rpc("delete_my_account");if(error)return say(m,plErr(error.message),1);
    S.prof=null;S.tab="mecze";await sb.auth.signOut();alert("Konto zostało usunięte.");return}
  if(e.target.id=="af"){const am=$("#am"),email=f.get("email").trim(),pw=f.get("pw");
    if(S.mode=="up"){const nick=(f.get("nick")||"").trim();if(!f.get("ok"))return say(am,"Zaznacz zgodę: 18+, regulamin i polityka prywatności.",1);
      if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{nick},captchaToken:tsTake()||undefined}});if(error)return say(am,plErr(error.message),1);
      if(!data.session){say(am,"Sprawdź skrzynkę i kliknij link potwierdzający. Potem możesz się zalogować.");return}}
    else{if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
      const {error}=await sb.auth.signInWithPassword({email,password:pw,options:{captchaToken:tsTake()||undefined}});if(error)return say(am,plErr(error.message),1)}
    S.tab="mecze"}
  if(e.target.id=="rf"){const am=$("#am");if(CFG.turnstile&&!tsTok)return say(am,"Potwierdź, że nie jesteś robotem.",1);
    const {error}=await sb.auth.resetPasswordForEmail(f.get("email").trim(),{redirectTo:location.origin,captchaToken:tsTake()||undefined});
    if(error)return say(am,plErr(error.message),1);
    return say(am,"Jeśli konto z tym adresem istnieje, wysłaliśmy link do resetu hasła. Sprawdź też spam.")}
  if(e.target.id=="nf"){const am=$("#am"),{error}=await sb.auth.updateUser({password:f.get("pw")});
    if(error)return say(am,plErr(error.message),1);
    S.mode="in";S.tab="mecze";history.replaceState(null,"",location.pathname);return load()}
  if(e.target.id=="cf"){const inp=$("#ci"),msg=$("#cm"),body=inp.value.trim();
    if(!body)return;
    if(LINK_RE.test(body))return say(msg,"Linki i adresy stron są niedozwolone.",1);
    const {error}=await sb.from("chat_messages").insert({user_id:S.user.id,body});
    if(error)return say(msg,"Nie udało się wysłać. Odczekaj kilka sekund między wiadomościami albo sprawdź, czy nie jesteś wyciszony.",1);
    inp.value="";say(msg,"");await loadChat();const el=$("#cl");if(el)el.scrollTop=el.scrollHeight}
  if(e.target.id=="mf"){const mm=$("#mm");S.ml=f.get("league");S.mr=f.get("round")||"";S.mk=f.get("kickoff")||"";
    const {error}=await sb.from("matches").insert({league_id:+f.get("league"),round:f.get("round")?+f.get("round"):null,home:f.get("home").trim(),away:f.get("away").trim(),kickoff:new Date(f.get("kickoff")).toISOString()});
    if(error)return say(mm,"Nie udało się dodać meczu.",1);await load();say($("#mm"),"Dodano.")}});

sb.auth.onAuthStateChange((ev,s)=>{S.user=s?.user||null;if(ev=="PASSWORD_RECOVERY"){S.tab="auth";S.mode="newpw"}setTimeout(load,0)});
if(/^#(regulamin|polityka)$/.test(location.hash))S.tab=location.hash.slice(1);
render();
</script>
